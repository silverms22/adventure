<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Orbit Survivor</title>
<style>
:root{
  --deep:#141033;
  --deep2:#0d0a24;
  --panel:rgba(38,30,74,0.92);
  --panel-line:rgba(178,158,255,0.18);
  --mint:#8ff0dc;
  --pink:#ffb3d9;
  --lav:#c3b0ff;
  --sky:#9fd8ff;
  --gold:#ffe08a;
  --danger:#ff7a9c;
  --text:#f2eeff;
  --text-dim:#9b93c4;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#07051a;font-family:var(--font);color:var(--text);}

#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#frame{position:relative;aspect-ratio:9/16;height:100%;max-width:100%;max-height:100%;overflow:hidden;
  background:var(--deep2);box-shadow:0 0 60px rgba(0,0,0,.7);}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

.layer{position:absolute;inset:0;pointer-events:none;}
#picker,#nav,#planet,#record,#goal,#pause,#tut,#clear,#over,#settings{z-index:6;}
#lobby.picking .currency{position:relative;z-index:7;}
#modal{z-index:8;}
.layer.on{pointer-events:auto;}
.hide{display:none !important;}

/* ---------- 인게임 HUD ---------- */
#hud{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;}
.hud-row{display:flex;justify-content:space-between;align-items:center;}
.res-row{display:flex;gap:8px;align-items:center;}
.score-block{display:flex;flex-direction:column;gap:2px;margin-top:12px;}
#scoreVal{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6);transition:color .2s;}
#scoreVal.record{color:var(--danger);text-shadow:0 0 16px rgba(255,122,156,.8);}
#bestVal{font-size:11px;color:var(--text-dim);font-weight:600;}
.gem-block{position:relative;display:flex;align-items:center;gap:6px;background:rgba(20,16,51,.6);
  border:1px solid var(--panel-line);border-radius:999px;padding:6px 12px;}
#gemVal{font-size:16px;font-weight:800;color:var(--sky);}
.dust-block{position:relative;display:flex;align-items:center;gap:5px;background:rgba(20,16,51,.6);
  border:1px solid var(--panel-line);border-radius:999px;padding:5px 11px;}
#dustVal{font-size:14px;font-weight:800;color:var(--gold);}

.pop{position:absolute;right:8px;top:2px;font-size:15px;font-weight:800;pointer-events:none;
  animation:popUp .9s ease-out forwards;}
@keyframes popUp{0%{opacity:0;transform:translateY(4px) scale(.8);}20%{opacity:1;transform:translateY(-6px) scale(1.15);}100%{opacity:0;transform:translateY(-26px) scale(1);}}

#recordBanner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:22px;font-weight:900;
  color:var(--danger);text-shadow:0 0 24px rgba(255,122,156,.9);animation:banner 1.4s ease-out forwards;}
@keyframes banner{0%{opacity:0;transform:scale(.6);}25%{opacity:1;transform:scale(1.1);}70%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.05);}}

.pause-btn{pointer-events:auto;width:38px;height:38px;border-radius:12px;background:rgba(20,16,51,.7);
  border:1px solid var(--panel-line);color:var(--text);font-family:var(--font);font-size:12px;
  font-weight:800;cursor:pointer;letter-spacing:1px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.pause-btn:active{transform:scale(.94);}

#stageHud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;pointer-events:none;}
#stageTime{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;
  text-shadow:0 2px 16px rgba(0,0,0,.7);font-variant-numeric:tabular-nums;}
.stage-bar{width:150px;height:4px;margin:9px auto 0;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;}
.stage-bar i{display:block;height:100%;width:0%;border-radius:3px;background:var(--mint);
  box-shadow:0 0 8px rgba(143,240,220,.7);transition:width .12s linear;}
#stageLabel{margin-top:7px;font-size:11px;font-weight:700;color:var(--text-dim);}
#multChip{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 78px);text-align:center;
  font-size:13px;font-weight:800;color:var(--gold);text-shadow:0 0 10px rgba(255,224,138,.6);pointer-events:none;}

/* 목표 안내 */
.tut-name{font-size:21px;font-weight:800;}
#tutCanvas{position:static;width:170px;height:auto;margin:6px auto 2px;display:block;}
.tut-desc{font-size:12.5px;line-height:1.7;color:var(--text-dim);margin-top:6px;}
.goal-stage{font-size:22px;font-weight:800;}
.goal-shape{font-size:12px;color:var(--text-dim);margin-top:4px;}
.goal-time{margin:18px 0 6px;}
.goal-time b{font-size:46px;font-weight:900;color:var(--mint);}
.goal-time span{font-size:15px;font-weight:800;margin-left:4px;}
.goal-tap{margin-top:14px;font-size:13px;font-weight:800;animation:blink 1.6s ease-in-out infinite;}

/* ---------- 공통 패널 ---------- */
.center-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;
  background:rgba(0,0,0,.75);}
.panel{width:100%;max-width:330px;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:22px;padding:22px;text-align:center;backdrop-filter:blur(8px);}
.panel h2{font-size:22px;font-weight:800;margin-bottom:6px;}
.panel p{font-size:13px;color:var(--text-dim);line-height:1.6;}

.btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:var(--font);font-size:15px;font-weight:800;
  color:#1a1338;background:linear-gradient(135deg,var(--mint),var(--sky));cursor:pointer;margin-top:14px;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:transparent;border:1px solid var(--panel-line);color:var(--text);}
.btn.small{width:auto;padding:9px 14px;font-size:12px;border-radius:11px;margin-top:0;}
.btn:disabled{opacity:.4;}

/* ---------- 토글 버튼 & 설정 레이아웃 ---------- */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:14px;color:var(--text);border-bottom:1px solid var(--panel-line);}
.toggle-btn{padding:6px 16px;border-radius:10px;border:1px solid var(--panel-line);font-family:var(--font);font-size:13px;font-weight:800;background:var(--mint);color:#16123a;cursor:pointer;min-width:60px;}
.toggle-btn.off{background:rgba(120,116,145,.35);color:var(--text-dim);}

/* ---------- 로비 ---------- */
#lobby{display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(13,10,36,.42) 0%,rgba(13,10,36,.84) 40%,#0d0a24 54%);}
.lobby-top{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
  display:flex;justify-content:space-between;align-items:center;}
.currency{display:flex;align-items:center;gap:6px;background:rgba(20,16,51,.7);border:1px solid var(--panel-line);
  border-radius:999px;padding:7px 14px;font-size:15px;font-weight:800;color:var(--sky);}
.best-chip{font-size:11px;color:var(--text-dim);font-weight:700;text-align:right;line-height:1.5;}

.hero{flex:1;min-height:0;position:relative;overflow:hidden;}
.hero-name{position:absolute;left:0;right:0;top:20px;height:32px;line-height:32px;
  text-align:center;font-weight:800;font-size:clamp(17px,5.6vw,24px);
  white-space:nowrap;overflow:hidden;padding:0 14px;pointer-events:none;}
.hero-sub{position:absolute;left:0;right:0;top:58px;height:16px;line-height:16px;
  text-align:center;font-size:11.5px;color:var(--text-dim);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 20px;pointer-events:none;}
.hero-stage{position:absolute;left:0;right:0;top:84px;bottom:112px;
  display:flex;align-items:center;justify-content:center;}
#heroCanvas{position:static;width:min(84%,320px);height:auto;}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(28,22,66,.8);border:1px solid var(--panel-line);color:var(--text-dim);font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.arrow.l{left:14px;} .arrow.r{right:14px;}

.slots{position:absolute;left:0;right:0;bottom:36px;height:64px;
  display:flex;justify-content:center;gap:14px;}
.slot{width:64px;height:64px;border-radius:14px;background:rgba(28,22,66,.6);
  border:1.5px dashed rgba(178,158,255,.28);position:relative;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.slot.filled{border-style:solid;border-color:var(--mint);background:rgba(143,240,220,.13);
  box-shadow:0 0 20px rgba(143,240,220,.22);}
.slot > *{pointer-events:none;}
.slot .sic{font-size:25px;line-height:1;}
.slot .slv{font-size:10px;font-weight:800;color:var(--gold);line-height:1;}
.slot .plus{font-size:26px;color:rgba(178,158,255,.4);}
.slot-hint{position:absolute;left:0;right:0;bottom:8px;height:14px;line-height:14px;
  text-align:center;font-size:10.5px;color:var(--text-dim);pointer-events:none;}
.lock-box{position:absolute;left:0;right:0;bottom:36px;height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;}
.lock-ic{font-size:22px;}
.lock-tx{font-size:13px;font-weight:800;color:var(--gold);}

/* --- 특성 고르기 팝업 (2열 6행) --- */
.pick-panel{max-width:352px;padding:20px 16px 10px;}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;
  max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px;}
.pick{position:relative;background:rgba(14,10,36,.6);border:1px solid var(--panel-line);border-radius:12px;
  padding:11px 7px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.pick.owned{background:rgba(48,40,96,.85);border-color:rgba(195,176,255,.45);}
.pick.on{border-color:var(--mint);border-width:1.5px;background:rgba(143,240,220,.16);
  box-shadow:0 0 0 1px var(--mint) inset,0 0 14px rgba(143,240,220,.25);}
.pick-ck{position:absolute;top:3px;right:5px;font-size:8.5px;color:#16123a;background:var(--mint);
  border-radius:6px;padding:1px 4px;font-weight:800;line-height:1.3;}
.pick.locked{cursor:default;background:rgba(10,7,26,.5);}
.pick.locked .pick-nm,.pick.locked .pick-dc{opacity:.4;}
.pick-nm{font-size:11.5px;font-weight:800;display:flex;align-items:baseline;gap:5px;line-height:1.25;}
.pick-lv{font-size:8.5px;font-weight:800;color:var(--gold);}
.pick-lv.none{color:var(--text-dim);}
.pick-dc{font-size:9.5px;line-height:1.2;color:var(--text-dim);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.pick-act{width:100%;margin-top:3px;padding:5px 4px;border:none;border-radius:8px;
  font-family:var(--font);font-size:10px;font-weight:800;line-height:1.2;text-align:center;
  background:linear-gradient(135deg,var(--lav),var(--pink));color:#1a1338;cursor:pointer;}
.pick-act.dim{background:rgba(120,116,145,.35);color:rgba(230,226,245,.5);cursor:default;}
.pick-act.max{background:none;color:var(--gold);padding:5px 4px;}
.pick-act.eq{background:rgba(143,240,220,.22);color:var(--mint);
  box-shadow:0 0 0 1px rgba(143,240,220,.6) inset;}

/* --- 최고 기록 팝업 --- */
.trophy{display:flex;align-items:center;gap:7px;background:rgba(20,16,51,.7);
  border:1px solid var(--panel-line);border-radius:999px;padding:7px 13px;
  font-family:var(--font);font-size:14px;font-weight:800;color:var(--gold);cursor:pointer;}
.trophy:active{transform:scale(.96);}

.panel.clean{border:none;background:rgba(30,24,68,.97);box-shadow:0 22px 70px rgba(0,0,0,.55);
  border-radius:26px;padding:24px 22px 18px;}
.rec-nick{font-size:13px;font-weight:800;margin-bottom:2px;}
.rec-name{font-size:20px;font-weight:800;margin-bottom:2px;}
#recCanvas{position:static;width:150px;height:100px;margin:4px auto 2px;display:block;}
.rec-slots{display:flex;justify-content:center;gap:12px;margin:8px 0 14px;}
.rec-slot{width:56px;height:56px;border-radius:16px;background:rgba(12,9,32,.55);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:23px;}
.rec-slot .slv{font-size:9.5px;font-weight:800;color:var(--gold);line-height:1;}
.rec-slot.empty{background:rgba(255,255,255,.04);}
.rec-stat{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;font-size:13px;color:var(--text-dim);}
.rec-stat b{font-size:19px;font-weight:800;color:var(--gold);}
.rec-stat.sub b{font-size:15px;color:var(--text);}
.rec-empty{font-size:13px;color:var(--text-dim);padding:26px 0;}
.btn.flat{background:none;border:none;color:var(--text-dim);font-size:13px;padding:10px;margin-top:6px;}

#playBar{flex:0 0 auto;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 10px);}
#playBar .btn{margin-top:0;padding:12px;}

#toast{pointer-events:none;position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(10,8,28,.94);
  border:1px solid var(--panel-line);border-radius:12px;padding:10px 16px;font-size:12px;font-weight:700;
  opacity:0;transition:opacity .2s;white-space:nowrap;}
#toast.show{opacity:1;}

/* ---------- 대문 ---------- */
#title{background:none;}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  align-items:center;padding:calc(env(safe-area-inset-top,0px) + 92px) 20px calc(env(safe-area-inset-bottom,0px) + 104px);}
.title-logo{text-align:center;font-size:44px;font-weight:900;letter-spacing:4px;line-height:1.04;
  text-shadow:0 4px 26px rgba(0,0,0,.75);}
.title-logo span{display:block;font-size:24px;letter-spacing:8px;color:var(--mint);margin-top:6px;
  text-shadow:0 0 18px rgba(143,240,220,.5);}
.title-foot{text-align:center;}
.title-tap{font-size:14px;font-weight:800;color:var(--text);animation:blink 1.7s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}

/* ---------- 로비 하단 모드 버튼 ---------- */
.mode-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch;}
.mode-row .btn{margin-top:0;}
.stage-group{min-width:0;display:flex;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(143,240,220,.35);}
.nav-btn{flex:0 0 46px;border-radius:0;background:rgba(143,240,220,.20);color:var(--mint);
  font-size:17px;padding:12px 0;border:none;border-right:1px solid rgba(143,240,220,.35);}
.stage-btn{flex:1;min-width:0;border-radius:0;padding:12px 4px;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.endless-btn{min-width:0;width:100%;padding:12px 4px;font-size:13.5px;white-space:nowrap;
  background:linear-gradient(135deg,var(--lav),var(--pink));border:none;color:#1a1338;}
.mode-row .btn:disabled{opacity:.4;}
.stage-group.off{box-shadow:0 0 0 1px rgba(178,158,255,.2);}

/* ---------- 스테이지 선택 ---------- */
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
  max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:none;padding:2px;}
#nav .panel.clean{touch-action:none;}
.nav-cell{position:relative;aspect-ratio:1;border-radius:11px;background:rgba(14,10,36,.6);
  border:1px solid var(--panel-line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;cursor:pointer;}
.nav-cell .ck{position:absolute;top:2px;right:4px;font-size:8.5px;color:var(--mint);}
.nav-cell.locked{opacity:.28;cursor:default;}
.nav-cell.cur{border-color:var(--mint);background:rgba(143,240,220,.14);}
.nav-cell .sh{font-size:7.5px;color:var(--text-dim);font-weight:700;margin-top:1px;}

/* ---------- 행성 선택 ---------- */
.planet-stage{position:relative;display:flex;align-items:center;justify-content:center;margin:4px 0 2px;}
#planetCanvas{position:static;width:min(58vw,200px);height:auto;}
.pl-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  background:rgba(28,22,66,.85);border:1px solid var(--panel-line);color:var(--text);
  font-family:var(--font);font-size:15px;cursor:pointer;}
.pl-arrow.l{left:-4px;} .pl-arrow.r{right:-4px;}
.planet-nm{font-size:16px;font-weight:800;}
.planet-sh{font-size:11px;color:var(--text-dim);margin-top:2px;}
.planet-mult{font-size:13px;font-weight:800;color:var(--gold);margin-top:6px;}
.planet-dots{display:flex;justify-content:center;gap:5px;margin:10px 0 2px;}
.planet-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);}
.planet-dots i.on{background:var(--mint);}

/* ---------- 스테이지 클리어 ---------- */
.clear-badge{font-size:13px;font-weight:900;letter-spacing:3px;color:var(--mint);margin-bottom:4px;}
.clear-unlock{font-size:11.5px;color:var(--gold);font-weight:700;margin-top:10px;min-height:16px;}
#clear .btn{margin-top:14px;}

/* ---------- 기록: 모드별 구분 ---------- */
.rec-tabs{display:flex;gap:6px;margin-bottom:12px;}
.rec-tab{flex:1;padding:8px;border-radius:10px;border:none;font-family:var(--font);font-size:12px;font-weight:800;
  background:rgba(14,10,36,.6);color:var(--text-dim);cursor:pointer;}
.rec-tab.on{background:var(--mint);color:#16123a;}

.result-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--panel-line);}
.result-row:last-child{border-bottom:none;}
.result-row b{font-weight:800;}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="game"></canvas>

  <!-- 인게임 HUD -->
  <div id="hud" class="layer hide">
    <div class="hud-row">
      <div class="res-row">
        <div class="gem-block"><span>💎</span><span id="gemVal">0</span><span id="gemPop"></span></div>
        <div class="dust-block"><span>✦</span><span id="dustVal">0</span></div>
      </div>
      <button class="pause-btn" id="btnPause">❚❚</button>
    </div>
    <div class="score-block">
      <div id="scoreVal">0</div>
      <div id="bestVal">BEST 0</div>
    </div>
    <div id="stageHud" class="hide">
      <div id="stageTime">0.0</div>
      <div class="stage-bar"><i id="stageFill"></i></div>
      <div id="stageLabel">스테이지 1</div>
    </div>
    <div id="multChip" class="hide"></div>
  </div>

  <!-- 대문 -->
  <div id="title" class="layer on">
    <div class="title-wrap">
      <div class="title-logo">ORBIT<span>SURVIVOR</span></div>
      <div class="title-foot">
        <div class="title-tap">탭하여 시작</div>
      </div>
    </div>
  </div>

  <!-- 로비 -->
  <div id="lobby" class="layer on">
    <div class="lobby-top">
      <div class="currency"><span>💎</span><span id="lobbyGem">0</span></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="trophy" id="btnTrophy">🏆<span id="lobbyBest">0</span></button>
        <button class="pause-btn" id="btnSettings" style="font-size:16px;">⚙️</button>
      </div>
    </div>

    <div class="hero">
      <div class="hero-name"><span id="heroTitle" class="hero-title"></span><span id="heroName">우주 가오리</span></div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="hero-stage">
        <div class="arrow l" id="arrowL">◀</div>
        <canvas id="heroCanvas" width="360" height="240"></canvas>
        <div class="arrow r" id="arrowR">▶</div>
      </div>
      <div class="slots" id="slots"></div>
      <div class="lock-box hide" id="lockBox">
        <div class="lock-ic">🔒</div>
        <div class="lock-tx" id="lockText"></div>
      </div>
      <div class="slot-hint" id="slotHint">칸을 누르면 특성을 고를 수 있어요</div>
    </div>

    <div id="playBar">
      <div class="mode-row">
        <div class="stage-group">
          <button class="btn nav-btn" id="btnNav">🧭</button>

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const hit = (ax, ay, ar, bx, by, br) => dist2(ax, ay, bx, by) <= (ar + br) * (ar + br);

const SHAPES = {

  rsquare:{ name:'네모',  p:t => { const a=t*TAU, n=4;
              const r=1/Math.pow(Math.pow(Math.abs(Math.cos(a)),n)+Math.pow(Math.abs(Math.sin(a)),n),1/n);
              return { x:Math.cos(a)*r, y:Math.sin(a)*r }; } },

  rtri:   { name:'세모',  p:t => { const a=t*TAU, r=1+0.34*Math.cos(3*a+Math.PI/2);

  card:   { name:'다이아',     p:t => { const a=t*TAU, n=1.12;

  clover: { name:'클로버',  p:t => { const a=t*TAU, r=1+0.22*Math.cos(4*a);

  heart:  { name:'하트',       p:t => { const a=t*TAU;
              const x=16*Math.pow(Math.sin(a),3);

const GROUP_START = [1, 5, 9, 13, 17, 21, 25, 28, 31, 34, 37];
const stageGroup = n => {
  let g = 0;

class OrbitPath {
  constructor(shapeId, spin) {
    this.id = shapeId;
    const def = SHAPES[shapeId] || SHAPES.circle;
    this.name = def.name;
    this.spin = spin === undefined ? (def.spin || 0) : spin;
    this.rot = 0;
    this.scale = 1;

    const N = 720, pts = [];
    let sum = 0;
    for (let i = 0; i < N; i++) {
      const q = def.p(i / N);
      const r = Math.hypot(q.x, q.y) || 1e-6;
      pts.push({ a: Math.atan2(q.y, q.x), r });
      sum += r;
    }
    const mean = sum / N;
    let rs = pts.map(q => q.r / mean);
    let lo = Math.min(...rs), hi = Math.max(...rs), k = 1;
    if (lo < CFG.ORBIT_MIN_RATIO) k = Math.min(k, (1 - CFG.ORBIT_MIN_RATIO) / (1 - lo));
    if (hi > CFG.ORBIT_MAX_RATIO) k = Math.min(k, (CFG.ORBIT_MAX_RATIO - 1) / (hi - 1));
    if (k < 1) rs = rs.map(r => 1 + (r - 1) * k);
    this.base = pts.map((q, i) => ({ x: Math.cos(q.a) * rs[i], y: Math.sin(q.a) * rs[i] }));
    this.minR = Math.min(...rs); this.maxR = Math.max(...rs);
    this.cum = [0];
    let total = 0;
    for (let i = 1; i <= N; i++) {
      const a = this.base[i - 1], b = this.base[i % N];
      total += Math.hypot(b.x - a.x, b.y - a.y);
      this.cum.push(total);
    }
    this.baseLen = total;
  }
  radius() { return CFG.ORBIT_MEAN * this.scale; }
  length() { return this.baseLen * this.radius(); }
  update(dt) { if (this.spin) this.rot = (this.rot + this.spin * dt) % TAU; }

  at(u, ahead = 0) {
    const N = this.base.length;
    u -= Math.floor(u);
    const target = u * this.baseLen;
    let lo = 0, hi = N;
    while (lo < hi) { const m = (lo + hi) >> 1; if (this.cum[m] < target) lo = m + 1; else hi = m; }
    const i = clamp(lo - 1, 0, N - 1), j = (i + 1) % N;
    const seg = this.cum[i + 1] - this.cum[i] || 1e-6;
    const f = clamp((target - this.cum[i]) / seg, 0, 1);
    const R = this.radius();
    const ax = this.base[i].x, ay = this.base[i].y, bx = this.base[j].x, by = this.base[j].y;
    let x = lerp(ax, bx, f) * R, y = lerp(ay, by, f) * R;
    let ang = Math.atan2(by - ay, bx - ax);
    const rot = this.rot + this.spin * ahead;
    if (rot) {
      const c = Math.cos(rot), sn = Math.sin(rot);
      const nx = x * c - y * sn; y = x * sn + y * c; x = nx;
      ang += rot;
    }
    return { x: CFG.CX + x, y: CFG.CY + y, ang };
  }
  outline() {
    const R = this.radius(), c = Math.cos(this.rot), sn = Math.sin(this.rot);
    return this.base.map(q => {
      const x = q.x * R, y = q.y * R;
      return { x: CFG.CX + (x * c - y * sn), y: CFG.CY + (x * sn + y * c) };
    });
  }
}

const SaveData = {
  key: 'orbit_survivor_v4',
  data: { gems: 0, best: 0, levels: {}, char: 'ray', equippedBy: {}, equipped: [null, null, null],
          bestRun: null, stageCleared: 0, stageBest: {}, stageRun: null, seenChar: {},
          bgmOn: true, sfxOn: true },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
    if (!this.data.levels) this.data.levels = {};
    if (!this.data.equippedBy) this.data.equippedBy = {};
    if (!this.data.stageBest) this.data.stageBest = {};
    if (!this.data.seenChar) this.data.seenChar = {};
    if (typeof this.data.stageCleared !== 'number') this.data.stageCleared = 0;
    if (typeof this.data.bgmOn !== 'boolean') this.data.bgmOn = true;
    if (typeof this.data.sfxOn !== 'boolean') this.data.sfxOn = true;
    if (!CHAR_MAP[this.data.char]) this.data.char = 'ray';
    if (Array.isArray(this.data.equipped) && this.data.equipped.some(Boolean) && !this.data.equippedBy[this.data.char])
      this.data.equippedBy[this.data.char] = this.data.equipped.slice();
    this.bindChar();
  },
  bindChar() {
    const c = this.data.char;
    const cur = this.data.equippedBy[c];
    const fixed = [null, null, null];
    if (Array.isArray(cur)) for (let i = 0; i < 3; i++) fixed[i] = cur[i] || null;
    this.data.equippedBy[c] = fixed;
    this.data.equipped = fixed;
  },
  setChar(id) { this.data.char = id; this.bindChar(); this.save(); },
  character() { return CHAR_MAP[this.data.char]; },
  isCharUnlocked(c) { return this.data.stageCleared >= (c.unlock || 0); },
  unlockedChars() { return CHARACTERS.filter(c => this.isCharUnlocked(c)); },
  unlockedThemes() { return PLANET_THEMES.map((t, i) => ({ theme: t, idx: i, shape: SHAPES[ENDLESS_SHAPES[i]] })); },
  nextStage() { return clamp(this.data.stageCleared + 1, 1, CFG.STAGE_MAX); },
  save() {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  },
  level(id) { return this.data.levels[id] || 0; },
  isOwned(id) { return this.level(id) > 0; },
  isEquipped(id) { return this.data.equipped.includes(id); },
  costOf(id) { return TRAIT_MAP[id].cost * (this.level(id) + 1); },
  canUpgrade(id) { return this.level(id) < TRAIT_MAP[id].max; },
  buy(id) {
    if (!this.canUpgrade(id)) return 'max';
    const c = this.costOf(id);
    if (this.data.gems < c) return 'poor';
    this.data.gems -= c;
    this.data.levels[id] = this.level(id) + 1;
    this.save();
    return 'ok';
  },
  slotOf(id) { return this.data.equipped.indexOf(id); },
  equippedList() { return this.data.equipped.filter(Boolean); },
  equipAt(slot, id) {
    if (!this.isOwned(id)) return 'locked';
    const eq = this.data.equipped;
    if (eq[slot] === id) { eq[slot] = null; this.save(); return 'off'; }
    const prev = eq.indexOf(id);
    if (prev >= 0) eq[prev] = null;
    eq[slot] = id; this.save();
    return 'on';
  },
  clearSlot(slot) { this.data.equipped[slot] = null; this.save(); },
  nickname() {
    const eq = this.data.equipped.filter(Boolean).slice().sort();
    if (eq.length >= 3) {
      const k3 = eq.join('|');
      if (NICK3[k3]) return NICK3[k3];
    }
    for (let i = 0; i < eq.length; i++) for (let j = i + 1; j < eq.length; j++) {
      const k = [eq[i], eq[j]].sort().join('|');
      if (NICK2[k]) return { label: NICK2[k], color: nick2Color(k) };
    }
    return null;
  }
};

    const S = id => this.lv[id] ? TRAIT_MAP[id].stat(this.lv[id]) : null;

    const eng = S('engine');
    const chr = save.character();
    this.charId       = chr.id;
    this.ability      = chr.ability || null;
    this.spin         = chr.spin || 0;
    this.playerSpeed  = CFG.PLAYER_SPEED * (eng ? eng.speed : 1) * chr.speedMul;
    this.scoreMul     = 1;
    this.hitRadius    = S('nano') ? S('nano').hit : CFG.PLAYER_HIT;
    this.magnetRange  = S('magnet') ? S('magnet').range : 0;

    this.feverCost    = S('saver') ? S('saver').cost : CFG.FEVER_COST;
    this.feverDur     = S('amp') ? S('amp').dur : CFG.FEVER_DUR;
    this.shieldGap    = S('shield') ? S('shield').interval : 0;
    this.auraGap      = S('aura') ? S('aura').interval : 0;
    this.auraRadius   = S('aura') ? S('aura').radius : 0;
    this.sonicCD      = S('sonic') ? S('sonic').cd : 0;
    this.sonicRadius  = S('sonic') ? S('sonic').radius : 0;
    this.railLife     = S('rail') ? S('rail').life : 0;
    this.droneCount   = S('drone') ? S('drone').count : 0;
    this.cloneCount   = S('clone') ? S('clone').count : 0;
    this.dustMul      = S('miner') ? S('miner').dust : 1;
    this.gemMul       = S('miner') ? S('miner').gem : 1;
  }
  has(id) { return this.lv[id] > 0; }
}

class Player {
  constructor(sk, path) {
    this.path = path;
    this.u = 0.75;
    this.dir = 1;
    this.speed = sk.playerSpeed;
    this.hitR = sk.hitRadius;
    this.flap = 0;
    this.self = 0;
    this.spin = sk.spin;
    this.ang = 0;
    this.x = 0; this.y = 0;
    this.sync();
  }
  sync() { const p = this.path.at(this.u); this.x = p.x; this.y = p.y; this.ang = p.ang; }
  update(dt, factor = 1) {
    this.u += this.speed * this.dir * factor * dt / this.path.length();
    this.u -= Math.floor(this.u);
    this.self = (this.self + this.spin * dt) % TAU;
    this.flap += dt * 6;
    this.sync();
  }
  heading() { return this.ang + (this.dir > 0 ? 0 : Math.PI); }
  future(t) { return this.path.at(this.u + this.speed * this.dir * t / this.path.length(), t); }
}

class Asteroid {
  constructor(x, y, vx, vy, r) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = r;
    this.rot = Math.random() * TAU;
    this.spin = rand(-2, 2);
    this.seed = Math.random() * 100;
    this.dead = false;
  }
  update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.spin * dt; }
  offscreen() {
    return this.x < -80 || this.x > CFG.W + 80 || this.y < -80 || this.y > CFG.H + 80;
  }
}

class Item {
  constructor(kind, x, y) {
    this.kind = kind;
    this.x = x; this.y = y;
    this.r = kind === 'gem' ? 11 : 9;
    this.life = CFG.ITEM_LIFE;
    this.t = Math.random() * 10;
    this.dead = false;
  }
  update(dt) { this.life -= dt; this.t += dt; if (this.life <= 0) this.dead = true; }
  get blinking() { return this.life < CFG.ITEM_BLINK; }
  get visible() { return !this.blinking || (Math.sin(this.life * 18) > -0.2); }
}

class Drone {
  constructor(idx, total, path) {
    this.idx = idx; this.total = total; this.path = path; this.u = idx / total; this.r = 11;
    const p = path.at(this.u);
    this.x = p.x; this.y = p.y;
  }
  update(dt) {
    this.u += 175 * dt / this.path.length();
    this.u -= Math.floor(this.u);
    const p = this.path.at(this.u);
    this.x = p.x; this.y = p.y;
  }
}

class Clone {
  constructor(idx, total, player) {
    this.idx = idx; this.total = total; this.ang = 0;
    this.x = CFG.CX; this.y = CFG.CY;
    if (player) this.update(player);
  }
  update(player) {
    const p = player.path.at(player.u + (this.idx + 1) / (this.total + 1));
    this.x = p.x; this.y = p.y; this.ang = p.ang;
  }
}

class Wave {
  constructor(x, y, maxR, kind, speed) {
    this.x = x; this.y = y; this.r = (kind === 'sonic' || kind === 'aura') ? 4 : CFG.PLANET_R;
    this.maxR = maxR; this.kind = kind; this.speed = speed; this.dead = false;
  }
  update(dt) { this.r += this.speed * dt; if (this.r > this.maxR) this.dead = true; }
  get alpha() { return clamp(1 - this.r / this.maxR, 0, 1); }
}

class RailSeg {
  constructor(x, y, a, life) { this.x = x; this.y = y; this.a = a + Math.PI / 2; this.life = life; this.max = life; }
  update(dt) { this.life -= dt; }
  get t() { return clamp(this.life / this.max, 0, 1); }
}

class Sparkle {
  constructor(x, y) {
    const a = Math.random() * TAU, sp = rand(46, 165);
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    this.max = rand(1.3, 1.9); this.life = this.max;
    this.age = 0;
    this.ph = Math.random() * TAU;
    this.rate = rand(3.2, 7.0);
    this.size = rand(4, 9);
    this.rot = Math.random() * TAU;
    this.color = pick(['#ffffff', '#ffe08a', '#8ff0dc', '#c3b0ff']);
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= 0.992; this.vy *= 0.992;
    this.age += dt; this.life -= dt;
  }
}

class Particle {
  constructor(x, y, vx, vy, r, color, life) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = r; this.color = color;
    this.life = life; this.max = life;
  }
  update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.vx *= 0.96; this.vy *= 0.96; this.life -= dt; }
  get t() { return clamp(this.life / this.max, 0, 1); }
}

class SpawnDirector {
  constructor(sk) {
    this.sk = sk;
    this.pending = [];
    this.astTimer = 1.5;
    this.dustTimer = 1.0;
    this.gemTimer = CFG.GEM_GAP * 0.6;
  }

  spawnPoint(angle) {
    const hx = CFG.W / 2 + CFG.SPAWN_MARGIN, hy = CFG.H / 2 + CFG.SPAWN_MARGIN;
    const c = Math.cos(angle), s = Math.sin(angle);
    const d = Math.min(Math.abs(hx / (c || 1e-6)), Math.abs(hy / (s || 1e-6)));
    return { x: CFG.CX + c * d, y: CFG.CY + s * d };
  }
  shoot(g, angle, speed, target, radius) {
    const p = this.spawnPoint(angle);
    const tx = target ? target.x : CFG.CX, ty = target ? target.y : CFG.CY;
    const dir = Math.atan2(ty - p.y, tx - p.x);
    const r = radius || CFG.AST_R;
    const a = new Asteroid(p.x, p.y, Math.cos(dir) * speed, Math.sin(dir) * speed, r);
    if (r > CFG.AST_R * 1.4) a.big = true;
    g.asteroids.push(a);
    return a;
  }
  predict(g, speed, err) {
    const travel = 360 / speed;
    const f = g.player.future(travel * 0.78);
    if (!err) return f;
    return g.player.future(travel * 0.78 + rand(-err, err));
  }
  maxOnScreen(lv) { return Math.round(13 + clamp(lv, 0, 60) * 0.38); }

  speedScale(lv) { return 1 + clamp(lv / CFG.STAGE_MAX, 0, 3.2) * 0.62; }
  pressure(lv) {
    return Math.max(0.40, 1.02 - clamp((lv - 1) / 39, 0, 3.6) * 0.15);
  }
  jitter(lv) {
    if (lv < 12) return 1;
    const spread = 0.22 + clamp((lv - 12) / 28, 0, 1) * 0.30;
    const fastChance = clamp((lv - 20) / 20, 0, 1) * 0.22;
    if (Math.random() < fastChance) return rand(1.45, 1.85);
    return rand(1 - spread, 1 + spread);
  }

  queue(delay, fn) { this.pending.push({ t: delay, fn }); }

  update(dt, g) {
    const lv = g.level();

    if (this.pending.length) {
      for (const q of this.pending) q.t -= dt;
      const ready = this.pending.filter(q => q.t <= 0);
      this.pending = this.pending.filter(q => q.t > 0);
      for (const q of ready) q.fn();
    }

    this.astTimer -= dt;
    if (this.astTimer <= 0) {
      if (g.asteroids.length + this.pending.length >= this.maxOnScreen(lv)) this.astTimer = 0.32;
      else this.astTimer = Math.max(0.30, this.run(g, lv));
    }

    this.dustTimer -= dt;
    if (this.dustTimer <= 0) {
      this.dustTimer = CFG.DUST_GAP / this.sk.dustMul * rand(0.8, 1.2);
      if (g.fever.active) g.spawnItem('gem');
      else if (g.items.filter(i => i.kind === 'dust').length < CFG.DUST_MAX) g.spawnItem('dust');
    }
    this.gemTimer -= dt;
    if (this.gemTimer <= 0) {
      this.gemTimer = CFG.GEM_GAP / this.sk.gemMul * rand(0.85, 1.15);
      if (g.items.filter(i => i.kind === 'gem').length < CFG.GEM_MAX) g.spawnItem('gem');
    }
  }

  run(g, lv) {
    const pool = SpawnDirector.PATTERNS.filter(p => lv >= p.minLv);
    let total = 0;
    for (const p of pool) total += p.w;
    let roll = Math.random() * total;
    const P = this.pressure(lv);
    for (const p of pool) { roll -= p.w; if (roll <= 0) return p.fn(this, g, lv) * P; }
    return pool[0].fn(this, g, lv) * P;
  }
}

SpawnDirector.PATTERNS = [
  { id:'single', minLv:1, w:34, fn(D, g, lv) {
      const sp = rand(104, 124) * D.speedScale(lv) * D.jitter(lv);
      D.shoot(g, Math.random() * TAU, sp);
      return lerp(1.25, 0.80, clamp(lv / 50, 0, 1));
    } },
  { id:'aimed', minLv:4, w:30, fn(D, g, lv) {
      const sp = rand(120, 142) * D.speedScale(lv) * D.jitter(lv);
      D.shoot(g, Math.random() * TAU, sp, D.predict(g, sp, 0.02));
      if (lv >= 26) D.shoot(g, Math.random() * TAU, sp * 0.85, D.predict(g, sp, 0.06));
      return lerp(1.05, 0.66, clamp(lv / 50, 0, 1));
    } },
  { id:'ring', minLv:3, w:16, fn(D, g, lv) {
      const n = 8 + Math.floor(clamp(lv / 9, 0, 5));
      const gap = lv >= 24 ? 2 : 3;
      const base = Math.random() * TAU, gi = (Math.random() * n) | 0;
      const sp = rand(104, 120) * D.speedScale(lv);
      let k = 0;
      for (let i = 0; i < n; i++) {
        if (i >= gi && i < gi + gap) continue;
        D.queue(k++ * 0.055, () => D.shoot(g, base + i * TAU / n, sp * rand(0.95, 1.06)));
      }
      return lerp(1.9, 1.35, clamp(lv / 50, 0, 1));
    } },
  { id:'spiral', minLv:7, w:14, fn(D, g, lv) {
      const n = 8 + Math.floor(clamp(lv / 16, 0, 2));
      const base = Math.random() * TAU, sp = rand(112, 130) * D.speedScale(lv);
      const cw = Math.random() < 0.5 ? 1 : -1;
      for (let i = 0; i < n; i++) {
        D.queue(i * 0.06, () => {
          const p = D.spawnPoint(base + cw * i * 0.42);
          const sx = CFG.CX + (p.x - CFG.CX), sy = CFG.CY + (p.y - CFG.CY);
          const dir = Math.atan2(CFG.CY - sy, CFG.CX - sx);
          g.asteroids.push(new Asteroid(sx, sy, Math.cos(dir) * sp, Math.sin(dir) * sp, CFG.AST_R));
        });
      }
      return lerp(2.0, 1.5, clamp(lv / 50, 0, 1));
    } },
  { id:'big', minLv:9, w:10, fn(D, g, lv) {
      const sp = rand(62, 82) * D.speedScale(lv);
      D.shoot(g, Math.random() * TAU, sp, lv >= 20 ? D.predict(g, sp, 0.03) : null, rand(20, 25));
      return lerp(1.7, 1.2, clamp(lv / 50, 0, 1));
    } },
  { id:'dart', minLv:12, w:16, fn(D, g, lv) {
      const sp = rand(158, 186) * D.speedScale(lv);
      const n = lv >= 26 ? 2 : 1;
      for (let i = 0; i < n; i++)
        D.shoot(g, Math.random() * TAU, sp, D.predict(g, sp, 0.05), CFG.AST_R * 0.5);
      return lerp(1.15, 0.7, clamp(lv / 40, 0, 1));
    } },
  { id:'arc', minLv:12, w:14, fn(D, g, lv) {
      const n = 5 + Math.floor(clamp(lv / 11, 0, 4));
      const base = Math.random() * TAU, spread = 0.95, sp = rand(112, 132) * D.speedScale(lv);
      for (let i = 0; i < n; i++)
        D.queue(i * 0.075, () => D.shoot(g, base + (i / (n - 1) - 0.5) * spread, sp * rand(0.93, 1.08)));
      return lerp(1.6, 1.15, clamp(lv / 50, 0, 1));
    } },
  { id:'cross', minLv:14, w:12, fn(D, g, lv) {
      const base = Math.random() * TAU, sp = rand(116, 134) * D.speedScale(lv);
      for (let q = 0; q < 4; q++) for (let i = -1; i <= 1; i++)
        D.queue((q * 3 + (i + 1)) * 0.05, () => D.shoot(g, base + q * Math.PI / 2 + i * 0.16, sp * (1 + i * 0.06)));
      return lerp(1.8, 1.35, clamp(lv / 50, 0, 1));
    } },
  { id:'lattice', minLv:20, w:12, fn(D, g, lv) {
      const a = Math.random() * TAU, sp = rand(108, 126) * D.speedScale(lv);
      const nx = Math.cos(a), ny = Math.sin(a), px = -ny, py = nx;
      const n = 7, gapAt = 1 + ((Math.random() * (n - 2)) | 0);
      for (let i = 0; i < n; i++) {
        if (i === gapAt) continue;
        const off = (i - (n - 1) / 2) * 74;
        const jt = i * 0.09 + rand(0, 0.05), sv = sp * rand(0.9, 1.1);
        D.queue(jt, () => {
          const sx = CFG.CX + nx * 620 + px * off, sy = CFG.CY + ny * 620 + py * off;
          g.asteroids.push(new Asteroid(sx, sy, -nx * sv, -ny * sv, CFG.AST_R));
        });
      }
      return lerp(2.0, 1.55, clamp(lv / 50, 0, 1));
    } },
  { id:'twinring', minLv:25, w:10, fn(D, g, lv) {
      const n = 10, base = Math.random() * TAU;
      const sp = rand(104, 116) * D.speedScale(lv);
      const gi = (Math.random() * n) | 0;
      let k = 0;
      for (let i = 0; i < n; i++) {
        if (i >= gi && i < gi + 3) continue;
        D.queue(k++ * 0.05, () => D.shoot(g, base + i * TAU / n, sp));
      }
      const g2 = ((gi + 5) % n);
      let k2 = 0;
      for (let i = 0; i < n; i++) {
        if (i >= g2 && i < g2 + 3) continue;
        D.queue(0.45 + k2++ * 0.05, () => D.shoot(g, base + (i + 0.5) * TAU / n, sp * 0.72));
      }
      return lerp(2.3, 1.8, clamp(lv / 50, 0, 1));
    } },

const PAL = {
  planetA:'#b9a7ff', planetB:'#6f5fb8', planetC:'#3a2f6e',
  planetFA:'#8ff0dc', planetFB:'#4fb8a8',
  ray:'#ffb3d9', rayB:'#ff8ec4', rayGlow:'rgba(255,179,217,.55)',
  rayF:'#ffe08a',
  ast:'#a89bd6', astB:'#6b5fa0', astEdge:'#d8cfff',
  dust:'#ffe08a', gem:'#9fd8ff', drone:'#7d9bb5',
};

const Draw = {
  bgCanvas: null,

  bgCache: {},
  buildBackground(theme) {
    const th = theme || PLANET_THEMES[0];
    if (this.bgCache[th.id]) { this.bgCanvas = this.bgCache[th.id]; return; }
    const c = document.createElement('canvas');
    c.width = CFG.W; c.height = CFG.H;
    const b = c.getContext('2d');
    const g = b.createLinearGradient(0, 0, 0, CFG.H);
    g.addColorStop(0, th.sky[0]); g.addColorStop(0.5, th.sky[1]); g.addColorStop(1, th.sky[2]);
    b.fillStyle = g; b.fillRect(0, 0, CFG.W, CFG.H);

    const blobs = [
      { x: 120, y: 210, r: 200, c: `rgba(${th.glow},0.12)` },
      { x: 430, y: 700, r: 230, c: 'rgba(90,180,210,0.14)' },
      { x: 300, y: 980, r: 200, c: `rgba(${th.glow},0.11)` },
      { x: 60,  y: 830, r: 160, c: 'rgba(120,150,255,0.10)' },
    ];
    blobs.forEach(o => {
      const rg = b.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      rg.addColorStop(0, o.c); rg.addColorStop(1, 'rgba(0,0,0,0)');
      b.fillStyle = rg; b.beginPath(); b.arc(o.x, o.y, o.r, 0, TAU); b.fill();
    });
    let seed = 7331;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    for (let i = 0; i < 170; i++) {
      const x = rnd() * CFG.W, y = rnd() * CFG.H, r = 0.5 + rnd() * 1.5;
      b.globalAlpha = 0.25 + rnd() * 0.6;
      b.fillStyle = rnd() > 0.8 ? '#ffd9f0' : '#ffffff';
      b.beginPath(); b.arc(x, y, r, 0, TAU); b.fill();
    }
    b.globalAlpha = 1;
    this.bgCache[th.id] = c;
    this.bgCanvas = c;
    this.twinkles = Array.from({ length: 18 }, () => ({ x: Math.random() * CFG.W, y: Math.random() * CFG.H, p: Math.random() * TAU, r: 1 + Math.random() * 1.4 }));
  },
  background(ctx, t, theme) {
    if (theme) this.buildBackground(theme);
    ctx.drawImage(this.bgCanvas, 0, 0);
    ctx.fillStyle = '#ffffff';
    for (const s of this.twinkles) {
      ctx.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2 + s.p));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },

  sparkle(ctx, k) {
    const fade = clamp(k.life / k.max, 0, 1);
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(k.age * k.rate + k.ph));
    const r = k.size * tw;
    ctx.save();
    ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    ctx.globalAlpha = fade * tw;
    ctx.fillStyle = k.color;
    ctx.shadowBlur = 10; ctx.shadowColor = k.color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU, rr = i % 2 ? r * 0.32 : r;
      i === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  },

  planet(ctx, s) {
    const R = CFG.PLANET_R, x = CFG.CX, y = CFG.CY;
    const fev = s.fever, th = s.theme || PLANET_THEMES[0];
    const glow = ctx.createRadialGradient(x, y, R * 0.9, x, y, R + 52);
    glow.addColorStop(0, fev ? 'rgba(143,240,220,.45)' : `rgba(${th.glow},.28)`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, R + 52, 0, TAU); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();
    const bg = ctx.createRadialGradient(x - R * .35, y - R * .4, R * .1, x, y, R * 1.15);
    bg.addColorStop(0, fev ? PAL.planetFA : th.a);
    bg.addColorStop(0.55, fev ? PAL.planetFB : th.b);
    bg.addColorStop(1, th.c);
    ctx.fillStyle = bg; ctx.fillRect(x - R, y - R, R * 2, R * 2);

    ctx.globalAlpha = 0.22; ctx.fillStyle = th.band;
    for (let i = 0; i < 3; i++) {
      const yy = y - R * 0.55 + i * R * 0.52 + Math.sin(s.t * 0.4 + i) * 2;
      ctx.beginPath(); ctx.ellipse(x + Math.sin(s.t * 0.3 + i) * 8, yy, R * 0.95, R * (0.10 - i * 0.015), 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#2b2358';
    ctx.beginPath(); ctx.ellipse(x + R * .3, y + R * .35, R * .34, R * .2, 0.4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    const sh = ctx.createRadialGradient(x - R * .45, y - R * .5, R * .2, x, y, R * 1.25);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(20,10,50,.6)');
    ctx.fillStyle = sh; ctx.fillRect(x - R, y - R, R * 2, R * 2);
    ctx.restore();

    ctx.strokeStyle = fev ? 'rgba(143,240,220,.9)' : `rgba(${th.glow},.55)`;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, R - 1, 0, TAU); ctx.stroke();
  },

  gauge(ctx, ratio, fever, pulse = 0) {
    const R = CFG.PLANET_R + 10 + pulse * 1.5, x = CFG.CX, y = CFG.CY, st = -Math.PI / 2;
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.arc(x, y, CFG.PLANET_R + 10, 0, TAU); ctx.stroke();
    if (ratio <= 0.002) return;
    ctx.lineWidth = 5 + pulse * 2.5;
    ctx.strokeStyle = fever ? '#8ff0dc' : '#ffe08a';
    ctx.shadowBlur = 12 + pulse * 14; ctx.shadowColor = ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(x, y, R, st, st + TAU * clamp(ratio, 0, 1)); ctx.stroke();
    const ea = st + TAU * clamp(ratio, 0, 1);
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(x + Math.cos(ea) * R, y + Math.sin(ea) * R, 2.4 + pulse * 1.6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  },

  orbitGuide(ctx, path) {
    const pts = path.outline();
    ctx.strokeStyle = 'rgba(195,176,255,.16)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
    ctx.closePath(); ctx.stroke();
    ctx.setLineDash([]);
  },
  stageRing(ctx, ratio) {
    const R = CFG.PLANET_R + 18, st = -Math.PI / 2;
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.arc(CFG.CX, CFG.CY, R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#8ff0dc'; ctx.shadowBlur = 8; ctx.shadowColor = '#8ff0dc';
    ctx.beginPath(); ctx.arc(CFG.CX, CFG.CY, R, st, st + TAU * clamp(ratio, 0, 1)); ctx.stroke();
    ctx.shadowBlur = 0;
  },

  ray(ctx, s) {
    const sc = s.scale || 1;
    const f = Math.sin(s.flap) * 4.5;
    const f2 = Math.sin(s.flap - 0.9) * 4;
    const al = s.alpha === undefined ? 1 : s.alpha;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.heading); ctx.scale(sc, sc);
    ctx.globalAlpha = al;

    ctx.strokeStyle = s.colorB; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 0);
    ctx.quadraticCurveTo(-20, f2, -30, f2 * 1.5);
    ctx.stroke();

    ctx.shadowBlur = 16; ctx.shadowColor = s.glow || PAL.rayGlow;
    const grad = ctx.createLinearGradient(-12, 0, 15, 0);
    grad.addColorStop(0, s.colorB); grad.addColorStop(1, s.color);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(13, 0);
    ctx.bezierCurveTo(10, -5, 3, -11 - f, -8, -15 - f);
    ctx.quadraticCurveTo(-4, -8, -11, -3);
    ctx.lineTo(-11, 3);
    ctx.quadraticCurveTo(-4, 8, -8, 15 + f);
    ctx.bezierCurveTo(3, 11 + f, 10, 5, 13, 0);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.shadowBlur = 0;
    for (const g of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(12, g * 3.5);
      ctx.quadraticCurveTo(17, g * 4.5, 18.5, g * 2);
      ctx.stroke();
    }

    ctx.globalAlpha = al * 0.40; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-1, 0, 8, 5, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = al;

    ctx.fillStyle = '#3a2f6e';
    ctx.beginPath(); ctx.arc(8.5, -4.6, 1.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(8.5, 4.6, 1.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(9, -5.1, 0.55, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(9, 4.1, 0.55, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  jelly(ctx, s) {
    const sc = s.scale || 1;
    const pulse = Math.sin(s.flap * 0.8);
    const by = 12 + pulse * 2.2;
    const bx = 13 - pulse * 1.5;
    const al = s.alpha === undefined ? 1 : s.alpha;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.heading); ctx.scale(sc, sc);
    ctx.globalAlpha = al;

    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const off = (i - 2) * 3.6;
      const ph = s.flap * 0.9 - i * 0.55;
      const len = 20 + (i % 2) * 7;
      ctx.globalAlpha = al * (0.75 - Math.abs(i - 2) * 0.12);
      ctx.strokeStyle = i % 2 ? s.color : s.colorB;
      ctx.lineWidth = 1.8 - Math.abs(i - 2) * 0.25;
      ctx.beginPath(); ctx.moveTo(-5, off * 0.7);
      ctx.bezierCurveTo(-12, off + Math.sin(ph) * 5, -20, off - Math.sin(ph) * 6, -5 - len, off + Math.sin(ph + 1) * 7);
      ctx.stroke();
    }
    ctx.globalAlpha = al;

    ctx.shadowBlur = 20; ctx.shadowColor = s.glow || 'rgba(170,200,255,.55)';
    const grad = ctx.createLinearGradient(-8, 0, bx, 0);
    grad.addColorStop(0, s.colorB); grad.addColorStop(1, s.color);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-3, -by);
    ctx.bezierCurveTo(7, -by, bx, -by * 0.55, bx, 0);
    ctx.bezierCurveTo(bx, by * 0.55, 7, by, -3, by);
    ctx.quadraticCurveTo(-8, by * 0.55, -5, by * 0.2);
    ctx.quadraticCurveTo(-9, 0, -5, -by * 0.2);
    ctx.quadraticCurveTo(-8, -by * 0.55, -3, -by);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.globalAlpha = al * 0.45; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(3, 0, bx * 0.42, by * 0.5, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = al * 0.85;
    for (let i = 0; i < 3; i++) {
      const a = s.flap * 0.5 + i * 2.1;
      ctx.fillStyle = i === 1 ? '#ffffff' : s.color;
      ctx.beginPath();
      ctx.arc(2 + Math.cos(a) * 4, Math.sin(a) * (by * 0.42), 1.5, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  star(ctx, s) {
    const sc = s.scale || 1;
    const al = s.alpha === undefined ? 1 : s.alpha;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.heading); ctx.scale(sc, sc);
    ctx.globalAlpha = al;

    const tips = [], vals = [];
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * TAU / 5;
      const wob = Math.sin(s.flap * 1.15 + i * 1.3) * 0.10;
      const len = 15.5 + Math.sin(s.flap * 1.5 + i * 2.1) * 1.1;
      tips.push({ x: Math.cos(a + wob) * len, y: Math.sin(a + wob) * len });
      const av = a + TAU / 10;
      vals.push({ x: Math.cos(av) * 5.4, y: Math.sin(av) * 5.4 });
    }

    ctx.shadowBlur = 18; ctx.shadowColor = s.glow || 'rgba(190,70,120,.5)';
    const grad = ctx.createRadialGradient(-2, -3, 2, 0, 0, 17);
    grad.addColorStop(0, '#ef6a92');
    grad.addColorStop(0.30, s.color);
    grad.addColorStop(0.62, '#7a3d9e');
    grad.addColorStop(1, s.colorB);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(tips[0].x, tips[0].y);
    for (let i = 0; i < 5; i++) {
      const v = vals[i], t = tips[(i + 1) % 5];
      ctx.quadraticCurveTo(v.x, v.y, t.x, t.y);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.globalAlpha = al * 0.30; ctx.fillStyle = '#ffd9e8';
    tips.forEach((t, i) => {
      for (let k = 1; k <= 2; k++) {
        ctx.beginPath();
        ctx.arc(t.x * (0.42 + k * 0.22), t.y * (0.42 + k * 0.22), 1.5 - k * 0.35, 0, TAU);
        ctx.fill();
      }
    });
    ctx.globalAlpha = al * 0.42;
    ctx.beginPath(); ctx.arc(0, 0, 5.2, 0, TAU); ctx.fill();
    ctx.globalAlpha = al;

    ctx.fillStyle = '#2b1b45';
    ctx.beginPath(); ctx.arc(-2.6, -1.2, 1.7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(2.6, -1.2, 1.7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-2.1, -1.8, 0.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(3.1, -1.8, 0.6, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  clown(ctx, s) {
    const sc = s.scale || 1;
    const w = Math.sin(s.flap * 1.4);
    const al = s.alpha === undefined ? 1 : s.alpha;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.heading); ctx.scale(sc, sc);
    ctx.globalAlpha = al;

    ctx.fillStyle = s.colorB;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.quadraticCurveTo(-17, -9 - w * 2, -19, -6 + w * 2);
    ctx.quadraticCurveTo(-14, 0, -19, 6 - w * 2);
    ctx.quadraticCurveTo(-17, 9 + w * 2, -9, 0);
    ctx.closePath(); ctx.fill();

    ctx.globalAlpha = al * 0.9;
    ctx.beginPath();
    ctx.moveTo(2, -6); ctx.quadraticCurveTo(-2, -12 - w, -7, -5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2, 6); ctx.quadraticCurveTo(-2, 12 + w, -7, 5);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = al;

    ctx.shadowBlur = 15; ctx.shadowColor = s.glow || 'rgba(255,170,80,.55)';
    const grad = ctx.createLinearGradient(14, -6, -13, 7);
    grad.addColorStop(0, '#ffe07a'); grad.addColorStop(0.30, '#ffc79a');
    grad.addColorStop(0.62, s.color); grad.addColorStop(1, s.colorB);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(1, 0, 13, 7.2, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.save();
    ctx.beginPath(); ctx.ellipse(1, 0, 13, 7.2, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = '#fffaf0';
    [[7.0, 2.2], [0.2, 2.5], [-6.6, 2.0]].forEach(([bx, bw], i) => {
      ctx.beginPath();
      ctx.moveTo(bx + bw, -10);
      ctx.quadraticCurveTo(bx + bw * 0.2, 0, bx + bw, 10);
      ctx.lineTo(bx - bw, 10);
      ctx.quadraticCurveTo(bx - bw * 0.2, 0, bx - bw, -10);
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();

    ctx.globalAlpha = al * 0.75; ctx.fillStyle = '#ffd9ec';
    ctx.beginPath(); ctx.ellipse(2.5, 5.6 + w * 0.8, 4.2, 2.1, 0.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = al;

    ctx.fillStyle = '#2b1b45';
    ctx.beginPath(); ctx.arc(8, -2.4, 2.0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(8.7, -3.1, 0.75, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  char(ctx, s) { (this[s.type] || this.ray).call(this, ctx, s); },

  asteroid(ctx, a) {
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    const g = ctx.createRadialGradient(-a.r * .3, -a.r * .3, a.r * .2, 0, 0, a.r);
    if (a.big) { g.addColorStop(0, '#d9a0b8'); g.addColorStop(1, '#8a5f7a'); }
    else { g.addColorStop(0, PAL.ast); g.addColorStop(1, PAL.astB); }
    ctx.fillStyle = g;
    ctx.strokeStyle = PAL.astEdge; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i <= 9; i++) {
      const t = i / 9 * TAU;
      const rr = a.r * (0.82 + 0.28 * Math.abs(Math.sin(t * 2.5 + a.seed)));
      const px = Math.cos(t) * rr, py = Math.sin(t) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = .35; ctx.fillStyle = '#2b2358';
    ctx.beginPath(); ctx.arc(a.r * .25, a.r * .2, a.r * .28, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  stardust(ctx, it) {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.t * 1.2);
    ctx.fillStyle = PAL.dust; ctx.shadowBlur = 12; ctx.shadowColor = PAL.dust;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const t = i / 8 * TAU, rr = i % 2 ? it.r * 0.42 : it.r;
      i === 0 ? ctx.moveTo(Math.cos(t) * rr, Math.sin(t) * rr) : ctx.lineTo(Math.cos(t) * rr, Math.sin(t) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore(); ctx.shadowBlur = 0;
  },

  diamond(ctx, it) {
    ctx.save(); ctx.translate(it.x, it.y + Math.sin(it.t * 3) * 2);
    ctx.fillStyle = PAL.gem; ctx.shadowBlur = 14; ctx.shadowColor = PAL.gem;
    ctx.beginPath();
    ctx.moveTo(0, -it.r); ctx.lineTo(it.r * .8, -it.r * .2);
    ctx.lineTo(0, it.r); ctx.lineTo(-it.r * .8, -it.r * .2);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = .55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(0, -it.r); ctx.lineTo(it.r * .3, -it.r * .2); ctx.lineTo(0, it.r * .2); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  },

  drone(ctx, d, t) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(t * 2);
    ctx.fillStyle = PAL.drone; ctx.shadowBlur = 6; ctx.shadowColor = PAL.drone;
    ctx.beginPath(); ctx.arc(0, 0, d.r * .5, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = PAL.drone; ctx.lineWidth = 1.4; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.ellipse(0, 0, d.r, d.r * .42, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, d.r * .42, d.r, 0, 0, TAU); ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
  },

  wave(ctx, w) {
    const color = w.kind === 'fever' ? '#8ff0dc'
      : (w.kind === 'shield' ? '#c3b0ff' : (w.kind === 'aura' ? '#a8e8ff' : '#ffb3d9'));
    ctx.globalAlpha = w.alpha * (w.kind === 'aura' ? 0.7 : 0.9);
    ctx.strokeStyle = color; ctx.lineWidth = (w.kind === 'sonic' || w.kind === 'aura') ? 3 : 4;
    ctx.shadowBlur = 16; ctx.shadowColor = color;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = w.alpha * 0.35; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.86, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  },

  rail(ctx, segs, color) {
    if (segs.length < 3) return;
    const W = 7;
    const wAt = s => W * Math.pow(s.t, 1.4);
    ctx.save(); ctx.globalAlpha = .5; ctx.fillStyle = color;
    ctx.shadowBlur = 12; ctx.shadowColor = color;
    ctx.beginPath();
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i], w = wAt(s);
      const x = s.x + Math.cos(s.a) * w, y = s.y + Math.sin(s.a) * w;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let i = segs.length - 1; i >= 0; i--) {
      const s = segs[i], w = wAt(s);
      ctx.lineTo(s.x - Math.cos(s.a) * w, s.y - Math.sin(s.a) * w);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  },

  softTrail(ctx, tr, color) {
    if (tr.length < 3) return;
    const W = 5.5, LIFE = 0.20;
    const wAt = q => W * Math.pow(clamp(1 - q.age / LIFE, 0, 1), 1.5);
    ctx.save(); ctx.globalAlpha = 0.34; ctx.fillStyle = color;
    ctx.shadowBlur = 9; ctx.shadowColor = color;
    ctx.beginPath();
    for (let i = 0; i < tr.length; i++) {
      const q = tr[i], w = wAt(q);
      const x = q.x + Math.cos(q.a) * w, y = q.y + Math.sin(q.a) * w;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let i = tr.length - 1; i >= 0; i--) {
      const q = tr[i], w = wAt(q);
      ctx.lineTo(q.x - Math.cos(q.a) * w, q.y - Math.sin(q.a) * w);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  },

  particle(ctx, p) {
    ctx.globalAlpha = p.t; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + p.t * 0.6), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  },

  ability(ctx, x, y, s) {
    const col = s.type === 'ghost' ? '#ffd9a0' : '#ff8fae';
    if (s.active) {
      const p = 1 - s.left / s.dur;
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      ctx.shadowBlur = 16; ctx.shadowColor = col;
      ctx.globalAlpha = 0.85 - p * 0.45;
      ctx.beginPath(); ctx.arc(x, y, 22 + p * 9, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;

      const w = 30, h = 3.5, gx = x - w / 2, gy = y - 27;
      ctx.fillStyle = 'rgba(10,8,28,.75)';
      ctx.beginPath(); ctx.roundRect(gx - 1, gy - 1, w + 2, h + 2, 3); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.roundRect(gx, gy, w * clamp(s.left / s.dur, 0, 1), h, 2); ctx.fill();
    } else if (s.cd > 0) {
      ctx.strokeStyle = s.type === 'ghost' ? 'rgba(255,217,160,.35)' : 'rgba(255,143,174,.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 20, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - s.cd / s.cdMax));
      ctx.stroke();
    }
  },

  planetPreview(ctx, theme, path) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    const k = (w / 2 - 6) / (CFG.ORBIT_MEAN * CFG.ORBIT_MAX_RATIO);
    ctx.scale(k, k);
    ctx.translate(-CFG.CX, -CFG.CY);
    ctx.strokeStyle = `rgba(${theme.glow},.55)`; ctx.lineWidth = 3 / k;
    const pts = path.outline();
    ctx.beginPath();
    pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
    ctx.closePath(); ctx.stroke();
    const g = ctx.createRadialGradient(CFG.CX - 14, CFG.CY - 16, 4, CFG.CX, CFG.CY, CFG.PLANET_R);
    g.addColorStop(0, theme.a); g.addColorStop(0.6, theme.b); g.addColorStop(1, theme.c);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CFG.CX, CFG.CY, CFG.PLANET_R, 0, TAU); ctx.fill();
    ctx.restore();
  },

  magnetField(ctx, x, y, r, t) {
    ctx.globalAlpha = .10 + .04 * Math.sin(t * 3);
    ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  },
};

const Title = {
  POOL: [0, 4, 5],
  build() {
    const g = pick(this.POOL);
    this.theme = PLANET_THEMES[g];
    this.shapeId = ENDLESS_SHAPES[g];
    this.path = new OrbitPath(this.shapeId);
    this.time = 0;
    const chars = SaveData.unlockedChars();
    const c = pick(chars);
    const path = new OrbitPath(this.shapeId);
    path.scale = 1.0;
    this.riders = [{ id: c.id, chr: c, path, u: Math.random(), speed: 76 }];
  },
  update(dt) {
    if (!this.path) this.build();
    this.time += dt;
    this.path.update(dt * 0.5);
    for (const r of this.riders) {
      r.path.rot = this.path.rot;
      r.u += r.speed * dt / r.path.length();
      r.u -= Math.floor(r.u);
    }
  },
  render(ctx) {
    ctx.clearRect(0, 0, CFG.W, CFG.H);
    Draw.background(ctx, this.time, this.theme);
    for (const r of this.riders) Draw.orbitGuide(ctx, r.path);
    Draw.planet(ctx, { t: this.time, fever: false, theme: this.theme });
    for (const r of this.riders) {
      const p = r.path.at(r.u);
      Draw.char(ctx, {
        type: r.id, x: p.x, y: p.y,
        heading: p.ang + (r.chr.spin ? this.time * r.chr.spin : 0),
        color: r.chr.color, colorB: r.chr.colorB, glow: r.chr.glow,
        flap: this.time * 3.4 + r.u * 9, scale: 1.3,
      });
    }
  },
};

const Renderer = {
  frame(ctx, g) {
    ctx.clearRect(0, 0, CFG.W, CFG.H);
    Draw.background(ctx, g.time, g.theme);
    Draw.orbitGuide(ctx, g.path);
    Draw.planet(ctx, { t: g.time, fever: g.fever.active, theme: g.theme });
    Draw.gauge(ctx, g.gaugeRatio(), g.fever.active, g.gaugePulse || 0);

    if (g.sk.railLife > 0) Draw.rail(ctx, g.rails, g.fever.active ? PAL.rayF : PAL.ray);
    else Draw.softTrail(ctx, g.trail, CHAR_MAP[g.charId].color);
    for (const it of g.items) {
      if (!it.visible) continue;
      it.kind === 'dust' ? Draw.stardust(ctx, it) : Draw.diamond(ctx, it);
    }
    for (const w of g.waves) Draw.wave(ctx, w);
    for (const d of g.drones) Draw.drone(ctx, d, g.time);
    if (g.sk.magnetRange > 0) Draw.magnetField(ctx, g.player.x, g.player.y, g.sk.magnetRange, g.time);
    if (g.ab) Draw.ability(ctx, g.player.x, g.player.y,
      { type: g.ab.type, active: g.abOn, left: g.abLeft, dur: g.ab.dur, cd: g.abCD, cdMax: g.ab.cd });
    for (const c of g.clones) Draw.char(ctx, {
      type: g.charId, x: c.x, y: c.y,
      heading: c.ang + (g.player.dir > 0 ? 0 : Math.PI) + (g.state === 'lobby' ? 0 : g.player.self),
      color: '#c3b0ff', colorB: '#8b7ad6', flap: g.player.flap + c.idx, alpha: .45, scale: .85
    });
    for (const a of g.asteroids) Draw.asteroid(ctx, a);
    const chr = CHAR_MAP[g.charId];
    const selfRot = g.state === 'lobby' ? 0 : g.player.self;
    Draw.char(ctx, {
      type: g.charId, x: g.player.x, y: g.player.y,
      heading: g.player.heading() + selfRot,
      color: g.fever.active ? PAL.rayF : chr.color,
      colorB: g.fever.active ? '#ffc04d' : chr.colorB,
      glow: chr.glow, flap: g.player.flap, scale: 1.0,
      alpha: g.ghosting ? 0.35 : 1
    });
    for (const p of g.particles) Draw.particle(ctx, p);
    for (const k of g.sparkles) Draw.sparkle(ctx, k);
  }
};

class Game {
  constructor() { this.state = 'title'; this.time = 0; this.charId = 'ray'; this.mode = 'endless'; this.stage = 1; this.theme = PLANET_THEMES[0]; }

  start(mode = 'endless', stage = 1, themeIdx = 0, shapeOverride = null) {
    this.mode = mode;
    this.stage = stage;
    this.theme = mode === 'stage' ? stageTheme(stage) : PLANET_THEMES[themeIdx];
    const shapeId = shapeOverride || (mode === 'stage' ? stageShape(stage) : ENDLESS_SHAPES[themeIdx]);
    const spin = mode === 'stage' && !shapeOverride ? stageSpin(stage) : 0;
    this.path = new OrbitPath(shapeId, spin);
    this.dronePath = new OrbitPath(shapeId, spin);
    this.dronePath.scale = 1.42;
    this.timeLimit = mode === 'stage' ? stageDuration(stage) : 0;

    this.sk = new SkillManager(SaveData);
    this.charId = this.sk.charId;
    this.player = new Player(this.sk, this.path);
    this.director = new SpawnDirector(this.sk);
    this.asteroids = []; this.items = []; this.waves = [];
    this.particles = []; this.rails = []; this.sparkles = [];
    this.drones = Array.from({ length: this.sk.droneCount }, (_, i) => new Drone(i, this.sk.droneCount, this.dronePath));
    this.clones = Array.from({ length: this.sk.cloneCount }, (_, i) => new Clone(i, this.sk.cloneCount, this.player));
    this.time = 0; this.score = 0; this.dust = 0; this.gems = 0;
    this.fever = { active: false, timer: 0, waveTimer: 0 };
    this.gaugeShown = 0; this.gaugePulse = 0;
    this.shieldTimer = this.sk.shieldGap;
    this.auraTimer = this.sk.auraGap;
    this.sonicTimer = 0;
    this.pathScaleTarget = 1;
    this.trail = [];
    this.ab = this.sk.ability;
    this.abOn = false; this.abLeft = 0; this.abCD = 0; this.brakeF = 1;
    this.railTimer = 0;
    this.recordHit = false;
    this.cleared = false;
    this.scoreMult = mode === 'endless' ? this.theme.mult : 1;
    this.startedAt = performance.now();
    this.state = mode === 'stage' ? 'ready' : 'play';
  }

  level() {
    if (this.mode === 'stage') return this.stage;
    return 1 + Math.floor(this.time / CFG.ENDLESS_STEP) * CFG.ENDLESS_RATE;
  }

  updateTrail(dt) {
    if (this.sk.railLife > 0) return;
    const tr = this.trail;
    for (const q of tr) q.age += dt;
    while (tr.length && tr[tr.length - 1].age > 0.20) tr.pop();
    tr.unshift({ x: this.player.x, y: this.player.y, a: this.player.ang + Math.PI / 2, age: 0 });
    if (tr.length > 26) tr.length = 26;
  }

  updateRails(dt) {
    if (this.sk.railLife <= 0) return;
    this.railTimer -= dt;
    if (this.railTimer <= 0) {
      this.railTimer = 0.02;
      this.rails.unshift(new RailSeg(this.player.x, this.player.y, this.player.ang, this.sk.railLife));
    }
    for (const s of this.rails) s.update(dt);
    while (this.rails.length && this.rails[this.rails.length - 1].life <= 0) this.rails.pop();
    if (this.rails.length > 90) this.rails.length = 90;
  }

  gaugeTarget() {
    if (this.fever.active) return this.fever.timer / this.sk.feverDur;
    return this.dust / this.sk.feverCost;
  }
  gaugeRatio() { return this.gaugeShown; }

  onTap() {
    if (this.state !== 'play') return;
    this.player.dir *= -1;
    this.boom(this.player.x, this.player.y, '#ffffff', 4, 60);
    if (this.sk.sonicRadius > 0 && this.sonicTimer <= 0) {
      this.waves.push(new Wave(this.player.x, this.player.y, this.sk.sonicRadius, 'sonic', 300));
      this.sonicTimer = this.sk.sonicCD;
    }
  }
  canAbility() { return !!this.ab && !this.abOn && this.abCD <= 0 && this.state === 'play'; }
  get ghosting() { return this.abOn && this.ab && this.ab.type === 'ghost'; }
  get braking() { return this.abOn && this.ab && this.ab.type === 'brake'; }
  startAbility() {
    if (!this.canAbility()) return;
    this.abOn = true; this.abLeft = this.ab.dur;
    this.boom(this.player.x, this.player.y,
      this.ab.type === 'ghost' ? '#ffd9a0' : '#ff8fae', 8, 70);
  }
  endAbility() {
    if (!this.abOn) return;
    const t = this.ab.type;
    this.abOn = false; this.abLeft = 0; this.abCD = this.ab.cd;
    if (t === 'brake') this.player.dir *= -1;
    this.boom(this.player.x, this.player.y, '#ffffff', 5, 90);
  }

  boom(x, y, color, n, spd = 90) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(spd * .3, spd);
      this.particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(1.5, 3.5), color, rand(.3, .6)));
    }
  }
  shatter(a) {
    const nx = a.x - CFG.CX, ny = a.y - CFG.CY;
    const len = Math.hypot(nx, ny) || 1;
    const base = Math.atan2(ny, nx);
    const sp = Math.max(96, Math.hypot(a.vx, a.vy) * 0.85);
    const fr = CFG.AST_R * 0.78;
    const out = CFG.PLANET_R + fr + 16;
    const px = CFG.CX + nx / len * out;
    const py = CFG.CY + ny / len * out;
    const n = 2 + ((Math.random() < 0.5) ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const ang = base + (i - (n - 1) / 2) * 0.6 + rand(-0.12, 0.12);
      this.asteroids.push(new Asteroid(px, py, Math.cos(ang) * sp, Math.sin(ang) * sp, fr));
    }
    this.boom(a.x, a.y, '#d9a0b8', 10, 170);
  }

  killAsteroid(a, score = 20) {
    a.dead = true;
    this.boom(a.x, a.y, PAL.astEdge, 7, 130);
    this.score += score * this.sk.scoreMul * this.scoreMult;
  }
  spawnItem(kind) {
    const p = this.path.at(Math.random());
    const n = p.ang + Math.PI / 2, off = rand(-16, 16);
    this.items.push(new Item(kind, p.x + Math.cos(n) * off, p.y + Math.sin(n) * off));
  }
  triggerFever() {
    this.dust -= this.sk.feverCost;
    AudioMgr.playSFX('fever');
    for (const it of this.items) {
      if (it.kind === 'dust') { it.kind = 'gem'; it.r = 11; this.boom(it.x, it.y, PAL.gem, 5, 90); }
    }
    this.fever.active = true;
    this.fever.timer = this.sk.feverDur;
    this.fever.waveTimer = 0;
  }

  step(dt) {
    if (this.state !== 'play') return;
    this.time += dt;
    this.score += CFG.SCORE_RATE * this.sk.scoreMul * this.scoreMult * dt;

    if (this.abCD > 0) this.abCD = Math.max(0, this.abCD - dt);
    if (this.abOn) {
      this.abLeft -= dt;
      if (this.abLeft <= 0) this.endAbility();
    }
    if (this.ab && this.ab.type === 'brake') {
      const target = this.braking ? 0 : 1;
      const rate = dt / this.ab.ramp;
      this.brakeF += clamp(target - this.brakeF, -rate, rate);
    }

    this.path.update(dt);
    this.dronePath.rot = this.path.rot;
    this.path.scale = lerp(this.path.scale, this.pathScaleTarget, 1 - Math.pow(0.02, dt));
    this.dronePath.scale = this.path.scale * 1.42;

    this.player.update(dt, this.brakeF);
    this.director.update(dt, this);

    if (this.mode === 'stage' && this.time >= this.timeLimit) { this.clear(); return; }

    if (this.fever.active) {
      this.fever.timer -= dt;
      this.fever.waveTimer -= dt;
      if (this.fever.waveTimer <= 0) {
        this.fever.waveTimer = CFG.FEVER_WAVE_GAP;
        this.waves.push(new Wave(CFG.CX, CFG.CY, 640, 'fever', 620));
      }
      if (this.fever.timer <= 0) { this.fever.active = false; this.fever.timer = 0; }
    } else if (this.dust >= this.sk.feverCost) {
      this.triggerFever();
    }

    if (this.sk.shieldGap > 0) {
      this.shieldTimer -= dt;
      if (this.shieldTimer <= 0) {
        this.shieldTimer = this.sk.shieldGap;
        this.auraTimer = this.sk.auraGap;
        this.waves.push(new Wave(CFG.CX, CFG.CY, this.path.radius() * 1.9 + 60, 'shield', 430));
      }
    }
    if (this.sk.auraGap > 0) {
      this.auraTimer -= dt;
      if (this.auraTimer <= 0) {
        this.auraTimer = this.sk.auraGap;
        this.waves.push(new Wave(this.player.x, this.player.y, this.sk.auraRadius, 'aura', 260));
      }
    }
    if (this.sonicTimer > 0) this.sonicTimer -= dt;

    this.updateTrail(dt);
    this.updateRails(dt);

    for (const d of this.drones) d.update(dt);
    for (const c of this.clones) c.update(this.player);

    for (const w of this.waves) w.update(dt);

    const pr = this.player.hitR;
    for (const a of this.asteroids) {
      a.update(dt);

      if (hit(a.x, a.y, a.r, CFG.CX, CFG.CY, CFG.PLANET_R)) {
        if (a.big) this.shatter(a);
        this.killAsteroid(a, 0);
        continue;
      }

      let killed = false;
      for (const w of this.waves) {
        const d = Math.hypot(a.x - w.x, a.y - w.y);
        if (Math.abs(d - w.r) < 18) { this.killAsteroid(a, w.kind === 'fever' ? 30 : 20); killed = true; break; }
      }
      if (killed) continue;

      for (const d of this.drones) {
        if (hit(a.x, a.y, a.r, d.x, d.y, d.r)) { this.killAsteroid(a); killed = true; break; }
      }
      if (killed) continue;

      if (this.sk.railLife > 0) {
        for (let i = 0; i < this.rails.length; i += 2) {
          const s = this.rails[i];
          if (dist2(a.x, a.y, s.x, s.y) < (a.r + 9) * (a.r + 9)) { this.killAsteroid(a, 15); killed = true; break; }
        }
      }
      if (killed) continue;

      if (!this.ghosting && hit(a.x, a.y, a.r, this.player.x, this.player.y, pr)) { this.gameOver(); return; }

      if (a.offscreen()) a.dead = true;
    }

    if (this.path.spin) {
      const da = this.path.spin * dt, c0 = Math.cos(da), s0 = Math.sin(da);
      for (const it of this.items) {
        const dx = it.x - CFG.CX, dy = it.y - CFG.CY;
        it.x = CFG.CX + dx * c0 - dy * s0;
        it.y = CFG.CY + dx * s0 + dy * c0;
      }
    }

    const collectors = [{ x: this.player.x, y: this.player.y }, ...this.clones];
    for (const it of this.items) {
      it.update(dt);
      if (it.dead) continue;
      for (const c of collectors) {
        const d = Math.hypot(it.x - c.x, it.y - c.y);
        if (this.sk.magnetRange > 0 && d < this.sk.magnetRange) {
          const k = 260 * dt / Math.max(d, 1);
          it.x += (c.x - it.x) * Math.min(k, 1); it.y += (c.y - it.y) * Math.min(k, 1);
        }
        if (d < pr + it.r + 4) { this.collect(it); break; }
      }
    }

    for (const p of this.particles) p.update(dt);

    const gt = this.gaugeTarget();
    this.gaugeShown += (gt - this.gaugeShown) * (1 - Math.exp(-dt * 9));
    if (Math.abs(gt - this.gaugeShown) < 0.002) this.gaugeShown = gt;
    if (this.gaugePulse > 0) this.gaugePulse = Math.max(0, this.gaugePulse - dt * 2.6);

    this.asteroids = this.asteroids.filter(a => !a.dead);
    this.items = this.items.filter(i => !i.dead);
    this.waves = this.waves.filter(w => !w.dead);
    this.particles = this.particles.filter(p => p.life > 0);
    for (const k of this.sparkles) k.update(dt);
    this.sparkles = this.sparkles.filter(k => k.life > 0);

    if (this.mode === 'endless' && !this.recordHit && this.score > SaveData.data.best && SaveData.data.best > 0) {
      this.recordHit = true; UI.showRecord();
    }
  }

  collect(it) {
    it.dead = true;
    AudioMgr.playSFX('item');
    if (it.kind === 'dust') {
      if (this.fever.active) this.score += 40 * this.sk.scoreMul * this.scoreMult;
      else { this.dust++; this.gaugePulse = 1; }
      this.boom(it.x, it.y, PAL.dust, 6, 100);
    } else {
      this.gems++;
      this.boom(it.x, it.y, PAL.gem, 8, 120);
      UI.popGem();
    }
  }

  clear() {
    this.state = 'clear';
    this.cleared = true;
    AudioMgr.playSFX('complete');
    for (const a of this.asteroids) this.boom(a.x, a.y, a.big ? '#d9a0b8' : PAL.ast, 9, 160);
    for (const it of this.items) this.boom(it.x, it.y, it.kind === 'gem' ? PAL.gem : PAL.dust, 6, 130);
    this.asteroids = []; this.items = [];
    this.waves.push(new Wave(CFG.CX, CFG.CY, 760, 'fever', 560));
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * TAU, r = rand(CFG.PLANET_R * 0.7, CFG.PLANET_R * 1.9);
      this.sparkles.push(new Sparkle(CFG.CX + Math.cos(a) * r, CFG.CY + Math.sin(a) * r));
    }
    const sc = Math.floor(this.score);
    SaveData.data.gems += this.gems;
    if (this.stage > SaveData.data.stageCleared) SaveData.data.stageCleared = this.stage;
    const prev = SaveData.data.stageBest[this.stage];
    if (!prev || sc > prev) SaveData.data.stageBest[this.stage] = sc;
    SaveData.save();
    UI.showClear(this.stage, sc, this.gems);
  }

  gameOver() {
    this.state = 'over';
    AudioMgr.playSFX('damage');
    this.boom(this.player.x, this.player.y, PAL.ray, 22, 220);
    const sc = Math.floor(this.score);
    const isNew = this.mode === 'endless' && sc > SaveData.data.best;
    SaveData.data.gems += this.gems;
    if (isNew) {
      SaveData.data.best = sc;
      const nick = SaveData.nickname();
      SaveData.data.bestRun = {
        score: sc, time: this.time, char: SaveData.data.char,
        nick: nick ? nick.label : '',
        nickColor: nick ? nick.color : null,
        traits: SaveData.data.equipped.map(id => id ? ({ id, lv: SaveData.level(id) }) : null),
      };
    }
    SaveData.save();
    UI.showResult(sc, this.time, this.dust, this.gems, isNew, this.mode, this.stage);
  }
}

const $ = id => document.getElementById(id);

const UI = {
  init() {
    this.hud = $('hud'); this.lobby = $('lobby'); this.over = $('over'); this.modal = $('modal');
    this.banner = null;

    $('title').onclick = () => { this.toLobby(); };
    $('btnStage').onclick = () => { if (!$('btnStage').disabled) this.startStage(SaveData.nextStage()); };

    $('btnNav').onclick = () => { if (!$('btnNav').disabled) this.openNav(); };
    $('navClose').onclick = () => $('nav').classList.add('hide');

    $('navBackdrop').onclick = e => { if (e.target === $('navBackdrop')) $('nav').classList.add('hide'); };
    $('planetClose').onclick = () => $('planet').classList.add('hide');
    $('plPrev').onclick = () => this.movePlanet(-1);
    $('plNext').onclick = () => this.movePlanet(1);
    $('plGo').onclick = () => this.startEndless(this.plIdx);
    $('planetBackdrop').onclick = e => { if (e.target === $('planetBackdrop')) $('planet').classList.add('hide'); };
