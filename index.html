    $('goalWrap').onclick = () => this.beginStage();
    $('tutWrap').onclick = () => this.closeTut();
    $('btnPause').onclick = () => this.pause();
    $('btnResume').onclick = () => this.resume();
    $('btnQuit').onclick = () => this.toLobby();
    $('btnClearLobby').onclick = () => this.toLobby();
    $('btnRetry').onclick = () => (game.mode === 'stage' ? this.startStage(game.stage) : this.startEndless(this.lastTheme || 0));
    $('btnLobby').onclick = () => this.toLobby();
    $('modalClose').onclick = () => this.modal.classList.add('hide');
    $('arrowL').onclick = () => this.changeChar(-1);
    $('arrowR').onclick = () => this.changeChar(1);
    $('btnTrophy').onclick = () => this.openRecord();
    $('btnSettings').onclick = () => this.openSettings();
    $('settingsClose').onclick = () => $('settings').classList.add('hide');
    $('settingsBackdrop').onclick = e => { if (e.target === $('settingsBackdrop')) $('settings').classList.add('hide'); };
    $('pickClose').onclick = () => this.closePicker();
    $('pickBackdrop').onclick = e => { if (e.target === $('pickBackdrop')) this.closePicker(); };
    $('recClose').onclick = () => this.closeRecord();
    $('recBackdrop').onclick = e => { if (e.target === $('recBackdrop')) this.closeRecord(); };

    $('toggleBgm').onclick = () => this.toggleBGM();
    $('pauseToggleBgm').onclick = () => this.toggleBGM();
    $('toggleSfx').onclick = () => this.toggleSFX();
    $('pauseToggleSfx').onclick = () => this.toggleSFX();

    $('slots').addEventListener('click', e => {
      const cell = e.target.closest('.slot');
      if (!cell || !cell.dataset.slot) return;
      this.openPicker(+cell.dataset.slot);
    });
    this.updateAudioToggles();
    this.refresh();
  },

  toggleBGM() {
    SaveData.data.bgmOn = !SaveData.data.bgmOn;
    SaveData.save();
    this.updateAudioToggles();
    if (SaveData.data.bgmOn) {
      if (game.state === 'play') AudioMgr.playBGM('play');
      else AudioMgr.playBGM('start');
    } else {
      AudioMgr.stopBGM();
    }
  },

  toggleSFX() {
    SaveData.data.sfxOn = !SaveData.data.sfxOn;
    SaveData.save();
    this.updateAudioToggles();
  },

  updateAudioToggles() {
    const bgmOn = SaveData.data.bgmOn;
    const sfxOn = SaveData.data.sfxOn;
    ['toggleBgm', 'pauseToggleBgm'].forEach(id => {
      const el = $(id);
      if (el) {
        el.textContent = bgmOn ? 'ON' : 'OFF';
        el.classList.toggle('off', !bgmOn);
      }
    });
    ['toggleSfx', 'pauseToggleSfx'].forEach(id => {
      const el = $(id);
      if (el) {
        el.textContent = sfxOn ? 'ON' : 'OFF';
        el.classList.toggle('off', !sfxOn);
      }
    });
  },

  openSettings() {
    this.updateAudioToggles();
    $('settings').classList.remove('hide');
  },

  openModal(title, body) {
    $('modalTitle').textContent = title; $('modalBody').textContent = body;
    this.modal.classList.remove('hide');
  },
  toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), 1400);
  },

  refresh() {
    $('lobbyGem').textContent = SaveData.data.gems;
    $('lobbyBest').textContent = SaveData.data.best.toLocaleString();

    const chr = SaveData.character();
    $('heroName').textContent = chr.name;
    $('heroSub').textContent = chr.sub;

    const nick = SaveData.nickname();
    const el = $('heroTitle');
    if (nick) { el.textContent = nick.label + ' '; el.style.color = nick.color; }
    else el.textContent = '';

    const locked = !SaveData.isCharUnlocked(chr);
    $('slots').classList.toggle('hide', locked);
    $('lockBox').classList.toggle('hide', !locked);
    $('slotHint').style.visibility = locked ? 'hidden' : '';
    $('lockText').textContent = `스테이지 ${chr.unlock} 클리어 시 해금!`;
    $('btnStage').disabled = locked;
    $('btnEndless').disabled = locked;
    $('btnNav').disabled = locked;
    document.querySelector('.stage-group').classList.toggle('off', locked);

    const eq = SaveData.data.equipped;
    $('slots').innerHTML = [0, 1, 2].map(i => {
      const id = eq[i];
      if (!id) return `<div class="slot" data-slot="${i}"><span class="plus">+</span></div>`;
      return `<div class="slot filled" data-slot="${i}">
                <span class="sic">${TRAIT_MAP[id].icon}</span>
                <span class="slv">Lv.${SaveData.level(id)}</span>
              </div>`;
    }).join('');
  },

  openPicker(slot) {
    if (!$('picker').classList.contains('hide')) return;
    this.pickSlot = slot;
    $('pickInfo').textContent = `${slot + 1}번 칸 · 눌러서 장착/해제, 닫기를 누르면 끝나요`;
    this.renderPicker();
    $('picker').classList.remove('hide');
    $('lobby').classList.add('picking');
  },
  closePicker() { $('picker').classList.add('hide'); $('lobby').classList.remove('picking'); },

  renderPicker() {
    const slot = this.pickSlot;
    $('pickGrid').innerHTML = TRAITS.map(t => {
      const lv = SaveData.level(t.id), owned = lv > 0, maxed = lv >= t.max;
      const here = SaveData.data.equipped[slot] === t.id;
      const elsewhere = !here && SaveData.isEquipped(t.id);
      const cost = SaveData.costOf(t.id);
      const poor = SaveData.data.gems < cost;
      const act = maxed ? `<div class="pick-act max">MAX</div>`
        : `<button class="pick-act${poor ? ' dim' : ''}" data-buy="${t.id}"${poor ? ' disabled' : ''}>${owned ? '레벨업' : '구매'} 💎${cost}</button>`;
      const equipped = here || elsewhere;
      const cls = equipped ? ' on' : (owned ? ' owned' : ' locked');
      return `<div class="pick${cls}" data-pick="${t.id}">
                ${equipped ? '<span class="pick-ck">✔ 장착중</span>' : ''}
                <div class="pick-nm">${t.name}<span class="pick-lv${owned ? '' : ' none'}">${owned ? `Lv.${lv}/${t.max}` : '미보유'}</span></div>
                <div class="pick-dc">${t.short}</div>
                ${act}
              </div>`;
    }).join('');

    $('pickGrid').querySelectorAll('[data-pick]').forEach(c => {
      c.onclick = e => {
        if (e.target.closest('[data-buy]')) return;
        this.choose(c.dataset.pick);
      };
    });
    $('pickGrid').querySelectorAll('[data-buy]').forEach(b =>
      b.onclick = () => { if (!b.disabled) this.buy(b.dataset.buy); });
  },

  choose(id) {
    if (SaveData.level(id) === 0) return this.toast('먼저 구매해야 장착할 수 있습니다');
    if (SaveData.isEquipped(id)) {
      SaveData.clearSlot(SaveData.slotOf(id));
      this.refresh();
      return this.renderPicker();
    }
    const r = SaveData.equipAt(this.pickSlot, id);
    this.refresh();
    this.renderPicker();
  },

  buy(id) {
    const cost = SaveData.costOf(id);
    const r = SaveData.buy(id);
    if (r === 'poor') return this.openModal('다이아 부족',
      `${TRAIT_MAP[id].name} 강화에 💎${cost} 가 필요합니다. 현재 💎${SaveData.data.gems} 보유 중이에요.`);
    if (r === 'max') return this.toast('이미 최대 레벨입니다');
    this.toast(`${TRAIT_MAP[id].name} Lv.${SaveData.level(id)} 달성!`);
    this.renderPicker();
    this.refresh();
  },

  changeChar(step) {
    const i = CHARACTERS.findIndex(c => c.id === SaveData.data.char);
    const next = CHARACTERS[(i + step + CHARACTERS.length) % CHARACTERS.length];
    SaveData.setChar(next.id);
    game.charId = next.id;
    this.refresh();
  },

  hideAll() {
    ['title', 'lobby', 'hud', 'over', 'clear', 'nav', 'planet', 'picker', 'record', 'modal', 'goal', 'pause', 'tut', 'settings']
      .forEach(id => $(id).classList.add('hide'));
  },
  toTitle() {
    this.hideAll();
    $('title').classList.remove('hide');
    Title.build();
    game.state = 'title';
    AudioMgr.playBGM('start');
  },
  toLobby() {
    this.hideAll();
    $('lobby').classList.remove('hide');
    game.start('endless', 1, 0);
    game.state = 'lobby';
    $('btnStage').textContent = `스테이지 ${SaveData.nextStage()}`;
    this.refresh();
    AudioMgr.playBGM('start');
  },
  enterGame(mode, stage, themeIdx) {
    this.hideAll();
    $('hud').classList.remove('hide');
    $('scoreVal').classList.remove('record');
    game.start(mode, stage, themeIdx);
    AudioMgr.playBGM('play');
    const st = mode === 'stage';
    $('stageHud').classList.toggle('hide', !st);
    $('multChip').classList.add('hide');
    $('multChip').textContent = '';
    $('scoreVal').style.display = st ? 'none' : '';
    $('bestVal').textContent = st ? '' : 'BEST ' + SaveData.data.best.toLocaleString();
    const chr = SaveData.character();
    this.pendingStage = st;
    if (chr.ability && !SaveData.data.seenChar[chr.id]) {
      SaveData.data.seenChar[chr.id] = true;
      SaveData.save();
      $('tutName').textContent = chr.name;
      $('tutDesc').innerHTML = chr.tip;
      this.tutChar = chr.id;
      game.state = 'ready';
      $('tut').classList.remove('hide');
    }
    if (st) {
      $('goalStage').textContent = `스테이지 ${stage}`;
      $('goalShape').textContent = `${stageTheme(stage).name} · ${orbitName(stage)}`;
      $('goalSec').textContent = stageDuration(stage);
      $('stageLabel').textContent = `스테이지 ${stage} · ${orbitName(stage)}`;
      $('stageTime').textContent = stageDuration(stage).toFixed(1);
      $('stageFill').style.width = '100%';
      if (!this.tutChar) $('goal').classList.remove('hide');
    } else {
      if (this.tutChar) game.state = 'ready';
    }
  },
  closeTut() {
    $('tut').classList.add('hide');
    this.tutChar = null;
    touch = null;
    if (this.pendingStage) $('goal').classList.remove('hide');
    else { game.startedAt = performance.now(); game.state = 'play'; }
  },
  beginStage() {
    $('goal').classList.add('hide');
    touch = null;
    game.startedAt = performance.now();
    game.state = 'play';
  },
  pause() {
    if (game.state !== 'play') return;
    game.state = 'paused';
    this.updateAudioToggles();
    $('pause').classList.remove('hide');
  },
  resume() {
    $('pause').classList.add('hide');
    touch = null;
    if (game.state === 'paused') { game.startedAt = performance.now(); game.state = 'play'; }
  },
  startStage(n) { this.enterGame('stage', n, 0); },
  startEndless(themeIdx) { this.lastTheme = themeIdx; this.enterGame('endless', 1, themeIdx); },

  openNav() {
    const unlocked = SaveData.nextStage();
    $('navInfo').textContent = `클리어 ${SaveData.data.stageCleared} / ${CFG.STAGE_MAX}`;
    let html = '';
    for (let n = 1; n <= CFG.STAGE_MAX; n++) {
      const done = n <= SaveData.data.stageCleared;
      const open = n <= unlocked;
      const cls = !open ? ' locked' : (n === unlocked ? ' cur' : '');
      html += `<div class="nav-cell${cls}"${open ? ` data-stage="${n}"` : ''}>
                 ${done ? '<span class="ck">✔</span>' : ''}${n}
                 <span class="sh">${(groupOf(n).spin ? '회전 ' : '') + SHAPES[stageShape(n)].name}</span>
               </div>`;
    }
    $('navGrid').innerHTML = html;
    $('navGrid').querySelectorAll('[data-stage]').forEach(c =>
      c.onclick = () => { if (this.navDrag < 10) this.startStage(+c.dataset.stage); });
    $('nav').classList.remove('hide');
  },

  initNavScroll() {
    const panel = document.querySelector('#nav .panel');
    const grid = $('navGrid');
    let sy = null, st = 0;
    this.navDrag = 0;
    panel.addEventListener('pointerdown', e => { sy = e.clientY; st = grid.scrollTop; this.navDrag = 0; });
    panel.addEventListener('pointermove', e => {
      if (sy === null) return;
      const dy = e.clientY - sy;
      this.navDrag = Math.max(this.navDrag, Math.abs(dy));
      grid.scrollTop = st - dy;
    });
    const end = () => { sy = null; };
    panel.addEventListener('pointerup', end);
    panel.addEventListener('pointercancel', end);
    panel.addEventListener('pointerleave', end);
  },

  openPlanet() {
    this.plIdx = this.plIdx || 0;
    this.renderPlanet();
    $('planet').classList.remove('hide');
  },
  movePlanet(step) {
    const n = PLANET_THEMES.length;
    this.plIdx = (this.plIdx + step + n) % n;
    this.renderPlanet();
  },
  renderPlanet() {
    const i = this.plIdx, th = PLANET_THEMES[i], shape = ENDLESS_SHAPES[i];
    Draw.planetPreview($('planetCanvas').getContext('2d'), th, new OrbitPath(shape));
    $('plName').textContent = th.name;
    $('plShape').textContent = `${SHAPES[shape].name} 궤도`;
    $('plMult').textContent = `점수 배율 ×${th.mult.toFixed(2)}`;
    $('plDots').innerHTML = PLANET_THEMES.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  },

  syncHUD(g) {
    const sc = Math.floor(g.score);
    $('scoreVal').textContent = sc.toLocaleString();
    if (g.mode === 'stage') {
      const left = Math.max(0, g.timeLimit - g.time);
      $('stageTime').textContent = left.toFixed(1);
      $('stageFill').style.width = `${clamp(left / g.timeLimit, 0, 1) * 100}%`;
    } else {
      $('multChip').textContent = '';
    }
    $('gemVal').textContent = g.gems;
    $('dustVal').textContent = `${g.dust} / ${g.sk.feverCost}`;
    if (g.recordHit) $('scoreVal').classList.add('record');
  },
  popGem() {
    const host = $('gemPop'); if (!host) return;
    const s2 = document.createElement('span');
    s2.className = 'pop'; s2.style.color = 'var(--sky)'; s2.textContent = '+1';
    host.appendChild(s2); setTimeout(() => s2.remove(), 900);
  },
  showRecord() {
    const d = document.createElement('div');
    d.id = 'recordBanner'; d.textContent = 'NEW RECORD!';
    this.hud.appendChild(d); setTimeout(() => d.remove(), 1500);
  },
  showClear(stage, score, gems) {
    $('clearTitle').textContent = `스테이지 ${stage} · ${stageTheme(stage).name}`;
    $('cScore').textContent = score.toLocaleString();
    $('cGem').textContent = '+' + gems;
    const newly = CHARACTERS.filter(c => c.unlock === stage);
    const shapeChanged = stage < CFG.STAGE_MAX && stageGroup(stage + 1) !== stageGroup(stage);
    const msg = [];
    if (newly.length) msg.push(`${newly[0].name} 해금!`);
    if (shapeChanged) msg.push(`다음 구간은 ${orbitName(stage + 1)}`);
    $('clearUnlock').textContent = msg.join(' · ');
    $('btnNext').style.display = stage >= CFG.STAGE_MAX ? 'none' : '';
    setTimeout(() => $('clear').classList.remove('hide'), 1700);
  },
  showResult(score, time, dust, gems, isNew, mode, stage) {
    $('rScore').textContent = score.toLocaleString();
    $('rTime').textContent = mode === 'stage'
      ? `${time.toFixed(1)}초 / ${stageDuration(stage)}초`
      : time.toFixed(1) + '초';
    $('rGem').textContent = '+' + gems;
    $('overTitle').textContent = isNew ? '신기록 달성!' : 'GAME OVER';
    setTimeout(() => $('over').classList.remove('hide'), 600);
  },

  openRecord() {
    this.recTab = this.recTab || 'stage';
    this.renderRecord();
    $('record').classList.remove('hide');
  },
  renderRecord() {
    const tab = this.recTab;
    const head = `<div class="rec-tabs">
        <button class="rec-tab${tab === 'stage' ? ' on' : ''}" data-tab="stage">스테이지</button>
        <button class="rec-tab${tab === 'endless' ? ' on' : ''}" data-tab="endless">무한모드</button>
      </div>`;
    let body;
    if (tab === 'stage') {
      const cleared = SaveData.data.stageCleared;
      this.recChar = null;
      if (!cleared) body = `<div class="rec-empty">아직 클리어한 스테이지가 없습니다.</div>`;
      else {
        const best = SaveData.data.stageBest[cleared] || 0;
        body = `<div class="rec-nick" style="color:var(--mint)">${stageTheme(cleared).name}</div>
          <div class="rec-name">스테이지 ${cleared}</div>
          <div class="rec-stat"><span>클리어 진행도</span><b>${cleared} / ${CFG.STAGE_MAX}</b></div>
          <div class="rec-stat sub"><span>해당 스테이지 최고 점수</span><b>${best.toLocaleString()}</b></div>`;
      }
    } else {
      const r = SaveData.data.bestRun;
      if (!r) { this.recChar = null; body = `<div class="rec-empty">아직 무한모드 기록이 없습니다.</div>`; }
      else {
        const chr = CHAR_MAP[r.char] || CHARACTERS[0];
        this.recChar = r.char;
        body = `<div class="rec-nick" style="color:${r.nickColor || 'var(--pink)'}">${r.nick || '기록 보유'}</div>
          <div class="rec-name">${chr.name}</div>
          <canvas id="recCanvas" width="300" height="200"></canvas>
          <div class="rec-slots">${[0, 1, 2].map(i => {
            const t = r.traits && r.traits[i];
            return t ? `<div class="rec-slot"><span>${TRAIT_MAP[t.id].icon}</span><span class="slv">Lv.${t.lv}</span></div>`
                     : `<div class="rec-slot empty"></div>`;
          }).join('')}</div>
          <div class="rec-stat"><span>최고 점수</span><b>${r.score.toLocaleString()}</b></div>
          <div class="rec-stat sub"><span>생존 시간</span><b>${r.time.toFixed(1)}초</b></div>`;
      }
    }
    $('recBody').innerHTML = head + body;
    $('recBody').querySelectorAll('[data-tab]').forEach(b =>
      b.onclick = () => { this.recTab = b.dataset.tab; this.renderRecord(); });
  },
  closeRecord() { $('record').classList.add('hide'); this.recChar = null; },
};

const canvas = $('game');
const ctx = canvas.getContext('2d');
canvas.width = CFG.W; canvas.height = CFG.H;

const game = new Game();
SaveData.load();
Draw.buildBackground();
UI.init();
game.start('endless', 1, 0);
game.charId = SaveData.data.char;
UI.toTitle();

const HOLD_MS = 200;
let touch = null;
const frame = $('frame');
frame.addEventListener('pointerdown', e => {
  if (game.state !== 'play') return;
  if (e.target.closest('button')) return;
  if (performance.now() - game.startedAt < 120) return;
  touch = { y: e.clientY, t: performance.now(), used: false, held: false };
});

frame.addEventListener('pointerup', e => {
  if (!touch || game.state !== 'play') { touch = null; return; }
  if (touch.held) game.endAbility();
  else if (!touch.used) game.onTap();
  touch = null;
});
frame.addEventListener('pointercancel', () => { if (touch && touch.held) game.endAbility(); touch = null; });

const heroCv = $('heroCanvas'), heroCtx = heroCv.getContext('2d');

let last = performance.now(), acc = 0;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);

  if (game.state !== 'play') touch = null;
  if (touch && !touch.used && !touch.held && game.canAbility() && now - touch.t > HOLD_MS) {
    game.startAbility(); touch.held = true;
  }

  if (game.state === 'play') {
    game.step(dt);
    UI.syncHUD(game);
  } else if (game.state === 'title') {
    Title.update(dt);
  } else if (game.state === 'lobby') {
    game.time += dt;
    game.path.update(dt * 0.5);
    game.player.update(dt * 0.35);
    for (const d of game.drones) d.update(dt * 0.35);
    for (const c of game.clones) c.update(game.player);
  } else if (game.state === 'ready') {
    game.time = 0;
  } else if (game.state === 'paused') {
  } else {
    game.time += dt;
    if (game.state === 'clear') {
      game.path.update(dt);
      game.player.update(dt);
      game.updateTrail(dt);
      game.updateRails(dt);
      for (const d of game.drones) d.update(dt);
      for (const c of game.clones) c.update(game.player);
      if (game.fever.active) {
        game.fever.timer -= dt;
        if (game.fever.timer <= 0) game.fever.active = false;
      }
      const gt = game.gaugeTarget();
      game.gaugeShown += (gt - game.gaugeShown) * (1 - Math.exp(-dt * 9));
    }
    for (const w of game.waves) w.update(dt);
    game.waves = game.waves.filter(w => !w.dead);
    for (const p of game.particles) p.update(dt);
    game.particles = game.particles.filter(p => p.life > 0);
    for (const k of game.sparkles) k.update(dt);
    game.sparkles = game.sparkles.filter(k => k.life > 0);
  }
  if (game.state === 'title') Title.render(ctx);
  else Renderer.frame(ctx, game);

  if (game.state === 'lobby') {
    const chr = SaveData.character();
    heroCtx.clearRect(0, 0, heroCv.width, heroCv.height);
    heroCtx.save(); heroCtx.translate(heroCv.width / 2, heroCv.height / 2);
    Draw.char(heroCtx, {
      type: chr.id, x: 0, y: Math.sin(game.time * 1.6) * 6, heading: 0, flap: game.time * 4,
      color: chr.color, colorB: chr.colorB, glow: chr.glow, scale: 2.6
    });
    heroCtx.restore();
  }

  if (UI.tutChar) {
    const tc = $('tutCanvas');
    if (tc) {
      const tctx = tc.getContext('2d'), chr = CHAR_MAP[UI.tutChar];
      const tt = now / 1000;
      tctx.clearRect(0, 0, tc.width, tc.height);
      tctx.save(); tctx.translate(tc.width / 2, tc.height / 2);
      Draw.char(tctx, {
        type: chr.id, x: 0, y: Math.sin(tt * 1.6) * 6, heading: 0,
        color: chr.color, colorB: chr.colorB, glow: chr.glow,
        flap: tt * 4, scale: 2.6
      });
      tctx.restore();
    }
  }

  if (UI.recChar) {
    const rc = $('recCanvas');
    if (rc) {
      const rctx = rc.getContext('2d'), chr = CHAR_MAP[UI.recChar];
      rctx.clearRect(0, 0, rc.width, rc.height);
      rctx.save(); rctx.translate(rc.width / 2, rc.height / 2);
      Draw.char(rctx, {
        type: chr.id, x: 0, y: Math.sin(game.time * 1.6) * 6, heading: 0, flap: game.time * 4,
        color: chr.color, colorB: chr.colorB, glow: chr.glow, scale: 2.6
      });
      rctx.restore();
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
